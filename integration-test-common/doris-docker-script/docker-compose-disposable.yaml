# Applied on top of docker-compose.yaml when the cluster's data is disposable
# (DorisContainer with Durability.DISPOSABLE): no test reads it back after the cluster stops.

services:

  doris-fe:
    environment:
      # start-fe.sh then turns off BDB JE syncs for the FE metadata.
      GRAVITINO_DISPOSABLE_DATA: "true"

  doris-be:
    volumes:
      # The BE's default storage_root_path (${DORIS_HOME}/storage, DORIS_HOME being the BE home).
      # tmpfs only takes what is written; the size is well above the 2 GB the FE wants free on a
      # disk (storage_min_left_capacity_bytes) before it places tablets there.
      - type: tmpfs
        target: /opt/apache-doris/be/storage
        tmpfs:
          size: 8g
