suite: test gravitino deployment
templates:
  - deployment.yaml
  - configmap.yaml
tests:
  - it: renders the default deployment
    template: deployment.yaml
    release:
      name: gravitino
      namespace: gravitino-system
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.namespace
          value: gravitino-system
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels.release
          value: gravitino
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: sqlfile
          any: true
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^docker\\.io/apache/gravitino:.+"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAVITINO_HOME
            value: /opt/gravitino
          any: true
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: http
            containerPort: 8090
            protocol: TCP
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: storage
            emptyDir: {}
          any: true

  - it: renders pod customization, templated env, and an existing storage claim
    release:
      name: gravitino-custom
    template: deployment.yaml
    set:
      replicas: 2
      serviceAccountName: gravitino-sa
      global:
        imagePullSecrets:
          - name: registry-secret
      podLabels:
        app.kubernetes.io/part-of: gravitino
      podAnnotations:
        prometheus.io/scrape: "true"
      envWithTpl:
        - name: RELEASE_NAME
          value: "{{ .Release.Name }}"
      envFrom:
        - configMapRef:
            name: gravitino-env
      persistence:
        enabled: true
        existingClaim: gravitino-data
      extraVolumes:
        - name: audit-config
          configMap:
            name: audit-config
      extraVolumeMounts:
        - name: audit-config
          mountPath: /opt/gravitino/audit
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.serviceAccountName
          value: gravitino-sa
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: registry-secret
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: gravitino
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RELEASE_NAME
            value: gravitino-custom
          any: true
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: gravitino-env
      - contains:
          path: spec.template.spec.volumes
          content:
            name: storage
            persistentVolumeClaim:
              claimName: gravitino-data
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: audit-config
            configMap:
              name: audit-config
          any: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: audit-config
            mountPath: /opt/gravitino/audit

  - it: renders security contexts, resources, and custom probes
    template: deployment.yaml
    set:
      podSecurityContext:
        fsGroup: 1000
      initContainerSecurityContext:
        runAsNonRoot: true
        runAsUser: 2000
      containerSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 2Gi
      initResources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 256Mi
      livenessProbe:
        httpGet:
          path: /api/version
          port: http
        initialDelaySeconds: 30
        timeoutSeconds: 3
      readinessProbe:
        httpGet:
          path: /api/health
          port: http
        initialDelaySeconds: 10
        timeoutSeconds: 2
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 2000
      - equal:
          path: spec.template.spec.initContainers[0].resources.requests.cpu
          value: 50m
      - equal:
          path: spec.template.spec.initContainers[0].resources.limits.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /api/version
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /api/health

  - it: renders MySQL initialization when MySQL is enabled
    template: deployment.yaml
    release:
      name: gravitino
    set:
      mysql:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: init-mysql
          any: true
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "init-mysql")].command[2]
          pattern: "Waiting for MySQL to be ready"
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-mysql")].env
          content:
            name: GRAVITINO_DB
            value: gravitino
          any: true

  - it: renders PostgreSQL initialization when PostgreSQL is enabled
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: init-postgresql
          any: true
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].command[2]
          pattern: "Waiting for PostgreSQL to be ready"
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: GRAVITINO_DB
            value: gravitino
          any: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: gravitino-postgresql
                key: password
          any: true
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].command[2]
          pattern: "psql -h gravitino-postgresql -U \\$POSTGRES_USER -d \\$GRAVITINO_DB -c"
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: PGPORT
            value: "5432"
          any: true

  - it: does not render init-postgresql for external PostgreSQL unless init.enabled
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
      entity:
        jdbcUrl: jdbc:postgresql://gravitino-cnpg-rw:5432/gravitino
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - notContains:
          path: spec.template.spec.initContainers
          content:
            name: init-postgresql
          any: true

  - it: uses postgresql.auth.existingSecret for init when Bitnami chart is enabled
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: true
        auth:
          existingSecret: gravitino-pg-credentials
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: gravitino-pg-credentials
                key: password
          any: true

  - it: derives GRAVITINO_DB from entity.jdbcUrl for external PostgreSQL
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          host: pg.example.ci.local
          existingSecret: gravitino-pg-secret
      entity:
        jdbcUrl: jdbc:postgresql://pg.example.ci.local:5432/gravitino_meta?sslmode=require
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: GRAVITINO_DB
            value: gravitino_meta
          any: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: PGSSLMODE
            value: require
          any: true

  - it: derives host port and sslmode from entity.jdbcUrl for external PostgreSQL
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          existingSecret: gravitino-pg-secret
      entity:
        jdbcUrl: jdbc:postgresql://pg.example.ci.local:5433/gravitino_meta?sslmode=require
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].command[2]
          pattern: "psql -h pg.example.ci.local -U \\$POSTGRES_USER -d \\$GRAVITINO_DB -c"
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: PGPORT
            value: "5433"
          any: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: PGSSLMODE
            value: require
          any: true

  - it: fails when external PostgreSQL entity.jdbcUrl has no database path
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          host: pg.example.ci.local
          existingSecret: gravitino-pg-secret
      entity:
        jdbcUrl: jdbc:postgresql://pg.example.ci.local:5432/
    asserts:
      - failedTemplate:
          errorMessage: "could not parse database name from entity.jdbcUrl for init-postgresql; use jdbc:postgresql://<host>:<port>/<database>"

  - it: renders custom PostgreSQL init secret and host when postgresql.init is set
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: true
        init:
          host: gravitino-cnpg-rw
          existingSecret: gravitino-cnpg-secret
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: gravitino-cnpg-secret
                key: password
          any: true
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].command[2]
          pattern: "psql -h gravitino-cnpg-rw"

  - it: renders init-postgresql for external PostgreSQL entity store
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          host: gravitino-cnpg-rw.gravitino.svc
          existingSecret: gravitino-cnpg-secret
      entity:
        jdbcUrl: jdbc:postgresql://gravitino-cnpg-rw.gravitino.svc:5432/gravitino
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
        jdbcPassword: ignored-in-configmap
    asserts:
      - contains:
          path: spec.template.spec.initContainers
          content:
            name: init-postgresql
          any: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: POSTGRES_USER
            value: gravitino_app
          any: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: gravitino-cnpg-secret
                key: password
          any: true
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].command[2]
          pattern: "psql -h gravitino-cnpg-rw.gravitino.svc"

  - it: fails when external PostgreSQL init enabled without postgresql.init.existingSecret
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          host: gravitino-cnpg-rw
      entity:
        jdbcUrl: jdbc:postgresql://gravitino-cnpg-rw:5432/gravitino
    asserts:
      - failedTemplate:
          errorMessage: "postgresql.init.existingSecret is required when postgresql.init.enabled is true for external PostgreSQL"

  - it: fails when entity.jdbcUrl authority is IPv6 and host/port are derived from the URL
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          existingSecret: gravitino-pg-secret
      entity:
        jdbcUrl: jdbc:postgresql://[::1]:5432/gravitino
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - failedTemplate:
          errorMessage: "entity.jdbcUrl authority is IPv6 or multi-host; set postgresql.init.host and postgresql.init.port explicitly (JDBC URL host/port fallback supports only a single host:port)"

  - it: fails when entity.jdbcUrl authority is multi-host and host/port are derived from the URL
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          existingSecret: gravitino-pg-secret
      entity:
        jdbcUrl: jdbc:postgresql://pg1.example.ci.local:5432,pg2.example.ci.local:5432/gravitino
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - failedTemplate:
          errorMessage: "entity.jdbcUrl authority is IPv6 or multi-host; set postgresql.init.host and postgresql.init.port explicitly (JDBC URL host/port fallback supports only a single host:port)"

  - it: renders when IPv6 entity.jdbcUrl has explicit postgresql.init.host and port
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          host: "::1"
          port: 5432
          existingSecret: gravitino-pg-secret
      entity:
        jdbcUrl: jdbc:postgresql://[::1]:5432/gravitino
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].command[2]
          pattern: "psql -h ::1"
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: PGPORT
            value: "5432"
          any: true

  - it: overrides JDBC-derived port and sslmode with postgresql.init.port and sslMode
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          existingSecret: gravitino-pg-secret
          port: 15432
          sslMode: verify-full
          ssl:
            existingSecret: gravitino-pg-ca
            caCert: ca.crt
      entity:
        jdbcUrl: jdbc:postgresql://pg.example.ci.local:5433/gravitino?sslmode=require
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: PGPORT
            value: "15432"
          any: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: PGSSLMODE
            value: verify-full
          any: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: PGSSLROOTCERT
            value: /db-ssl/ca.crt
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: postgresql-init-ssl
          any: true


  - it: derives currentSchema from entity.jdbcUrl into PGOPTIONS search_path
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          existingSecret: gravitino-pg-secret
      entity:
        jdbcUrl: jdbc:postgresql://pg.example.ci.local:5432/gravitino_meta?currentSchema=gravitino&sslmode=require
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: PG_CURRENT_SCHEMA
            value: gravitino
          any: true
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: PGOPTIONS
            value: "-c search_path=gravitino"
          any: true
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].command[2]
          pattern: "CREATE SCHEMA IF NOT EXISTS"

  - it: overrides JDBC currentSchema with postgresql.init.currentSchema
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          existingSecret: gravitino-pg-secret
          currentSchema: custom_schema
      entity:
        jdbcUrl: jdbc:postgresql://pg.example.ci.local:5432/gravitino_meta?currentSchema=gravitino
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: PGOPTIONS
            value: "-c search_path=custom_schema"
          any: true

  - it: fails when sslmode is verify-full without postgresql.init.ssl.existingSecret
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          existingSecret: gravitino-pg-secret
          sslMode: verify-full
      entity:
        jdbcUrl: jdbc:postgresql://pg.example.ci.local:5432/gravitino
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - failedTemplate:
          errorPattern: "postgresql.init.ssl.existingSecret .* verify-ca or verify-full"

  - it: fails when entity.jdbcUrl sslmode is verify-ca without CA Secret
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          existingSecret: gravitino-pg-secret
      entity:
        jdbcUrl: jdbc:postgresql://pg.example.ci.local:5432/gravitino?sslmode=verify-ca
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - failedTemplate:
          errorPattern: "postgresql.init.ssl.existingSecret .* verify-ca or verify-full"


  - it: fails when currentSchema is not a simple identifier
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          existingSecret: gravitino-pg-secret
          currentSchema: 'bad;schema'
      entity:
        jdbcUrl: jdbc:postgresql://pg.example.ci.local:5432/gravitino
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - failedTemplate:
          errorPattern: "must be a simple PostgreSQL identifier"

  - it: renders wait timeout in init-postgresql readiness loop
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: false
        init:
          enabled: true
          existingSecret: gravitino-pg-secret
          waitTimeoutSeconds: 120
      entity:
        jdbcUrl: jdbc:postgresql://pg.example.ci.local:5432/gravitino
        jdbcDriver: org.postgresql.Driver
        jdbcUser: gravitino_app
    asserts:
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].command[2]
          pattern: "timeout=120"
      - matchRegex:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].command[2]
          pattern: "timed out after"

  - it: evaluates postgresql.auth.existingSecret as a template for Bitnami init
    template: deployment.yaml
    release:
      name: gravitino
    set:
      postgresql:
        enabled: true
        auth:
          existingSecret: "{{ .Release.Name }}-pg-credentials"
    asserts:
      - contains:
          path: spec.template.spec.initContainers[?(@.name == "init-postgresql")].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: gravitino-pg-credentials
                key: password
          any: true

  - it: renders topologySpreadConstraints when set
    template: deployment.yaml
    release:
      name: gravitino
    set:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gravitino
    asserts:
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: topology.kubernetes.io/zone
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].whenUnsatisfiable
          value: DoNotSchedule
