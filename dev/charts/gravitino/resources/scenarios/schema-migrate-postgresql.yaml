## Fresh-install coverage for schema.migrate.enabled with in-chart PostgreSQL.
postgresql:
  enabled: true

schema:
  migrate:
    enabled: true

replicas: 1

initScript: |
  cp /tmp/conf/* ${GRAVITINO_HOME}/conf
  echo "Start the Gravitino Server"
  /bin/bash ${GRAVITINO_HOME}/docker/docker-entrypoint.sh

# Fit the 512Mi limit: chart default GRAVITINO_MEM is -Xms1024m (entrypoint also
# disables UseContainerSupport), which OOMs under this CI resource budget.
env:
  - name: GRAVITINO_MEM
    value: "-Xms256m -Xmx256m -XX:MaxMetaspaceSize=128m"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 512Mi
