status = {{ .Values.log4j2Properties.status | default "warn" }}

# Log files location
property.basePath = {{ .Values.log4j2Properties.basePath | default "${sys:gravitino.log.path}" }}
property.serverName = {{ .Values.log4j2Properties.serverName | default "${sys:gravitino.server.name}" }}

# Log retention. Rolled archives are kept for logMaxAge. Their total size is also capped: when the
# cap is exceeded, the oldest archives are deleted first. The cap does not include the file that is
# currently being written.
property.logMaxAge = {{ .Values.log4j2Properties.logMaxAge | default "30d" }}
property.serverLogMaxTotalSize = {{ .Values.log4j2Properties.serverLogMaxTotalSize | default "2GB" }}

# RollingFileAppender name, pattern, path and rollover policy
appender.rolling.type = {{ .Values.log4j2Properties.rollingAppenderType | default "RollingFile" }}
appender.rolling.name = {{ .Values.log4j2Properties.rollingAppenderName | default "fileLogger" }}
appender.rolling.fileName = {{ .Values.log4j2Properties.rollingAppenderFileName | default "${basePath}/${serverName}.log" }}
appender.rolling.filePattern = {{ .Values.log4j2Properties.rollingAppenderFilePattern | default "${basePath}/${serverName}_%d{yyyyMMdd}.%i.log.gz" }}
appender.rolling.layout.type = {{ .Values.log4j2Properties.rollingAppenderLayoutType | default "PatternLayout" }}
appender.rolling.layout.pattern = {{ .Values.log4j2Properties.rollingAppenderLayoutPattern | default "%d{yyyy-MM-dd HH:mm:ss.SSS} %level [%t] [%l] - %msg%n" }}
appender.rolling.policies.type = {{ .Values.log4j2Properties.rollingAppenderPoliciesType | default "Policies" }}

# RollingFileAppender rotation policy
appender.rolling.policies.size.type = {{ .Values.log4j2Properties.rollingAppenderPoliciesSizeType | default "SizeBasedTriggeringPolicy" }}
appender.rolling.policies.size.size = {{ .Values.log4j2Properties.rollingAppenderPoliciesSizeSize | default "100MB" }}
appender.rolling.policies.time.type = {{ .Values.log4j2Properties.rollingAppenderPoliciesTimeType | default "TimeBasedTriggeringPolicy" }}
appender.rolling.policies.time.interval = {{ .Values.log4j2Properties.rollingAppenderPoliciesTimeInterval | default 1 }}
appender.rolling.policies.time.modulate = {{ .Values.log4j2Properties.rollingAppenderPoliciesTimeModulate | default true }}
appender.rolling.strategy.type = {{ .Values.log4j2Properties.rollingAppenderStrategyType | default "DefaultRolloverStrategy" }}
# Keep every archive of a day. Archives are removed only by the Delete action below.
appender.rolling.strategy.fileIndex = {{ .Values.log4j2Properties.rollingAppenderStrategyFileIndex | default "nomax" }}
appender.rolling.strategy.delete.type = {{ .Values.log4j2Properties.rollingAppenderStrategyDeleteType | default "Delete" }}
appender.rolling.strategy.delete.basePath = {{ .Values.log4j2Properties.rollingAppenderStrategyDeleteBasePath | default "${basePath}" }}
appender.rolling.strategy.delete.maxDepth = {{ .Values.log4j2Properties.rollingAppenderStrategyDeleteMaxDepth | default 1 }}
appender.rolling.strategy.delete.ifFileName.type = IfFileName
# Must match the archive names of rollingAppenderFilePattern, or archives are never deleted.
appender.rolling.strategy.delete.ifFileName.glob = {{ .Values.log4j2Properties.rollingAppenderStrategyDeleteIfFileNameGlob | default "${serverName}_*.log.gz" }}
# Delete archives older than logMaxAge, and the oldest archives beyond serverLogMaxTotalSize
appender.rolling.strategy.delete.ifFileName.ifAny.type = IfAny
appender.rolling.strategy.delete.ifFileName.ifAny.ifAccumulatedFileSize.type = IfAccumulatedFileSize
appender.rolling.strategy.delete.ifFileName.ifAny.ifAccumulatedFileSize.exceeds = ${serverLogMaxTotalSize}
appender.rolling.strategy.delete.ifFileName.ifAny.ifLastModified.type = {{ .Values.log4j2Properties.rollingAppenderStrategyDeleteIfLastModifiedType | default "IfLastModified" }}
appender.rolling.strategy.delete.ifFileName.ifAny.ifLastModified.age = {{ .Values.log4j2Properties.rollingAppenderStrategyDeleteIfLastModifiedAge | default "${logMaxAge}" }}

# Suppress verbose JCasbin authorization decision logs by default
logger.jcasbin.name = org.casbin.jcasbin
logger.jcasbin.level = {{ .Values.log4j2Properties.jcasbinLoggerLevel | default "warn" }}

# Configure root logger
rootLogger.level = {{ .Values.log4j2Properties.rootLoggerLevel | default "info" }}
rootLogger.appenderRef.rolling.ref = {{ .Values.log4j2Properties.rootLoggerAppenderRefRollingRef | default "fileLogger" }}

{{- range $key, $val := .Values.additionalLog4j2Properties }}
{{ $key }} = {{ tpl $val $ }}
{{- end }}