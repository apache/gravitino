{{- if eq (include "gravitino.schemaMigrateEnabled" . | trim) "true" }}
{{- $_ := include "gravitino.schemaMigrateSslValidate" . }}
{{- $engine := include "gravitino.schemaMigrateEngine" . | trim }}
{{- $dbHost := include "gravitino.schemaMigrateHost" . | trim }}
{{- $dbPort := include "gravitino.schemaMigratePort" . | trim }}
{{- $dbName := include "gravitino.schemaMigrateDatabase" . | trim }}
{{- $pgSchema := include "gravitino.schemaMigrateCurrentSchema" . | trim }}
{{- $pgSslMode := include "gravitino.schemaMigrateSslMode" . | trim }}
{{- $sslCaSecret := include "gravitino.schemaMigrateSslCaSecretName" . | trim }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gravitino.schemaMigrateJobName" . }}
  namespace: {{ include "gravitino.namespace" . }}
  labels:
    {{- include "gravitino.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-migrate
spec:
  backoffLimit: {{ .Values.schema.migrate.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.schema.migrate.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 600
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        {{- include "gravitino.labels" . | nindent 8 }}
        app.kubernetes.io/component: schema-migrate
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: sqlfile
          image: {{ include "gravitino.image" . }}
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command:
            - /bin/bash
            - -c
            - |
              cp -r /opt/gravitino/scripts/* /tmp/scripts/
              VERSION=$(ls /opt/gravitino/libs/gravitino-server-* | grep -oP '[0-9]+\.[0-9]+\.[0-9]+'|head -1)
              echo $VERSION > /tmp/scripts/version.txt
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp/scripts/
              name: scripts-emptydir
      containers:
        - name: schema-migrate
          {{- if eq $engine "mysql" }}
          image: {{ include "init-mysql.image" . }}
          {{- else }}
          image: {{ include "init-postgresql.image" . }}
          {{- end }}
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command:
            - /bin/bash
            - /schema-migrate.sh
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          env:
            - name: DB_ENGINE
              value: {{ $engine | quote }}
            - name: DB_HOST
              value: {{ $dbHost | quote }}
            - name: DB_PORT
              value: {{ $dbPort | quote }}
            - name: GRAVITINO_DB
              value: {{ $dbName | quote }}
            - name: SCRIPTS_DIR
              value: /scripts
            - name: BASELINE_VERSION
              value: {{ .Values.schema.baselineVersion | default "" | quote }}
            {{- if eq $engine "mysql" }}
            {{- if .Values.mysql.enabled }}
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gravitino.mysql.secretName" . }}
                  key: mysql-root-password
            {{- else }}
            - name: MYSQL_USER
              value: {{ .Values.entity.jdbcUser | quote }}
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gravitino.schemaMigrateSecretName" . | trim }}
                  key: {{ .Values.schema.migrate.existingSecretPasswordKey | default "password" }}
            {{- end }}
            {{- else }}
            - name: POSTGRES_USER
              {{- if .Values.postgresql.enabled }}
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gravitino.postgresql.secretName" . }}
                  key: password
              {{- else }}
              value: {{ .Values.entity.jdbcUser | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gravitino.schemaMigrateSecretName" . | trim }}
                  key: {{ .Values.schema.migrate.existingSecretPasswordKey | default "password" }}
              {{- end }}
            - name: PGPORT
              value: {{ $dbPort | quote }}
            {{- if $pgSslMode }}
            - name: PGSSLMODE
              value: {{ $pgSslMode | quote }}
            {{- end }}
            {{- if $pgSchema }}
            - name: PG_CURRENT_SCHEMA
              value: {{ $pgSchema | quote }}
            - name: PGOPTIONS
              value: {{ printf "-c search_path=%s" $pgSchema | quote }}
            {{- end }}
            {{- if $sslCaSecret }}
            - name: PGSSLROOTCERT
              value: /db-ssl/ca.crt
            {{- end }}
            {{- end }}
          volumeMounts:
            - mountPath: /scripts
              name: scripts-emptydir
            - mountPath: /schema-migrate.sh
              name: gravitino-conf
              subPath: schema-migrate.sh
              readOnly: true
            {{- if $sslCaSecret }}
            - name: schema-migrate-ssl
              mountPath: /db-ssl
              readOnly: true
            {{- end }}
      volumes:
        - name: scripts-emptydir
          emptyDir: {}
        - name: gravitino-conf
          configMap:
            name: {{ include "gravitino.fullname" . }}
        {{- if $sslCaSecret }}
        - name: schema-migrate-ssl
          secret:
            secretName: {{ $sslCaSecret }}
            items:
              - key: {{ include "gravitino.schemaMigrateSslCaKey" . | trim }}
                path: ca.crt
        {{- end }}
{{- end }}