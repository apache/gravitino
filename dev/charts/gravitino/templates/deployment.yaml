apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gravitino.fullname" . }}
  namespace: {{ include "gravitino.namespace" . }}
  labels:
    {{- include "gravitino.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ include "gravitino.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "gravitino.name" . }}
        name: {{ include "gravitino.fullname" . }}
        release: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
          {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}    
      initContainers:
        - name: sqlfile
          image: {{ include "gravitino.image" . }}
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command:
            - /bin/bash
            - -c
            - |
              cp -r /opt/gravitino/scripts/*  /tmp/scripts/
              VERSION=$(ls /opt/gravitino/libs/gravitino-server-* | grep -oP '[0-9]+\.[0-9]+\.[0-9]+'|head -1)
              echo $VERSION > /tmp/scripts/version.txt
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp/scripts/
              name: scripts-emptydir
      {{- if eq (include "gravitino.mysqlSchemaInitEnabled" . | trim) "true" }}
        - name: init-mysql
          image: {{ include "init-mysql.image" . }}
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command:
            - /bin/bash
            - -c
            - |
              while ! mysql -h {{ .Release.Name }}-mysql -u root -e "SELECT 1"; do
                echo "Waiting for MySQL to be ready..."
                sleep 2
              done
              VERSION=$(cat /scripts/version.txt)
              if [ -z "$VERSION" ]; then
                echo "ERROR:Please set VERSION"
                exit 1
              fi
              dir="/scripts/mysql"
              schema_file=$(ls $dir/schema-*-mysql.sql | sort -V | awk -F'[-]' '$2 <= '$VERSION' {print $0}' | tail -n 1)
              if [ ! -f "$schema_file" ]; then
                echo "ERROR:Failed to find schema file $schema_file"
                exit 1
              fi
              upgrade_file=$(ls $dir/upgrade-*-to-*-mysql.sql | sort -V | awk -F'[-]' '$4 <= '$VERSION' {print $0}' | tail -n 1)
              if [ ! -f "$upgrade_file" ]; then
                echo "ERROR:Failed to find upgrade file $upgrade_file"
                exit 1
              fi
              echo "Schema file: $schema_file"
              echo "Upgrade file: $upgrade_file"
              if ! mysql -h {{ .Release.Name }}-mysql -u root -D $GRAVITINO_DB <"$upgrade_file"; then
                echo "WARNING: Upgrade script failed: $upgrade_file" >&2
                echo "Continuing with schema script..." >&2
              fi
              mysql -h {{ .Release.Name }}-mysql -u root -D $GRAVITINO_DB <$schema_file
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mysql
                  key: mysql-root-password
            - name: GRAVITINO_DB
              value: {{ .Values.mysql.auth.database }}
          volumeMounts:
            - mountPath: /scripts
              name: scripts-emptydir
      {{- else if and .Values.mysql.enabled (eq (include "gravitino.schemaWaitEnabled" . | trim) "true") }}
        - name: init-mysql
          image: {{ include "init-mysql.image" . }}
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              VERSION=$(cat /scripts/version.txt)
              if [ -z "$VERSION" ]; then
                echo "ERROR: Please set VERSION (missing /scripts/version.txt)" >&2
                exit 1
              fi
              echo "Waiting for schema version ${VERSION} (written by the schema-migrate Job)..."
              {{- include "gravitino.schemaWaitPreamble" . | nindent 14 }}
              while true; do
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "ERROR: timed out after ${timeout}s waiting for schema version ${VERSION}" >&2
                  exit 1
                fi
                if mysql -h {{ .Release.Name }}-mysql -u root -e "SELECT 1" >/dev/null 2>&1; then
                  current=$(mysql -h {{ .Release.Name }}-mysql -u root -D "$GRAVITINO_DB" -sNe "{{ include "gravitino.schemaReadyQuery" "mysql" }}" 2>/dev/null | tr -d '[:space:]' || true)
                  if [ "$current" = "$VERSION" ]; then
                    echo "Schema version ${current} is ready."
                    exit 0
                  fi
                  echo "Recorded schema version is '${current:-<none>}'; waiting for ${VERSION}..."
                else
                  echo "Waiting for MySQL to be ready..."
                fi
                sleep 2
              done
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          env:
            - name: SCHEMA_WAIT_TIMEOUT
              value: {{ include "gravitino.schemaWaitTimeoutSeconds" . | quote }}
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mysql
                  key: mysql-root-password
            - name: GRAVITINO_DB
              value: {{ .Values.mysql.auth.database }}
          volumeMounts:
            - mountPath: /scripts
              name: scripts-emptydir
      {{- end }}
      {{- if eq (include "gravitino.postgresqlSchemaInitEnabled" . | trim) "true" }}
        - name: init-postgresql
          image: {{ include "init-postgresql.image" . }}
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command:
            - /bin/bash
            - -c
            - |
              while ! PGPASSWORD=$POSTGRES_PASSWORD psql -h {{ .Release.Name }}-postgresql -U $POSTGRES_USER -c "SELECT 1"; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
              VERSION=$(cat /scripts/version.txt)
              if [ -z "$VERSION" ]; then
                echo "ERROR:Please set VERSION"
                exit 1
              fi
              dir="/scripts/postgresql"
              schema_file=$(ls $dir/schema-*-postgresql.sql | sort -V | awk -F'[-]' '$2 <= '$VERSION' {print $0}' | tail -n 1)
              if [ ! -f "$schema_file" ]; then
                echo "ERROR:Failed to find schema file $schema_file"
                exit 1
              fi
              upgrade_file=$(ls $dir/upgrade-*-to-*-postgresql.sql | sort -V | awk -F'[-]' '$4 <= '$VERSION' {print $0}' | tail -n 1)
              if [ ! -f "$upgrade_file" ]; then
                echo "ERROR:Failed to find upgrade file $upgrade_file"
                exit 1
              fi
              echo "Schema file: $schema_file"
              echo "Upgrade file: $upgrade_file"
              if ! PGPASSWORD=$POSTGRES_PASSWORD psql -h {{ .Release.Name }}-postgresql -U $POSTGRES_USER -d $GRAVITINO_DB -f "$upgrade_file"; then
                echo "WARNING: Upgrade script failed: $upgrade_file" >&2
                echo "Continuing with schema script..." >&2 
              fi
              PGPASSWORD=$POSTGRES_PASSWORD psql -h {{ .Release.Name }}-postgresql -U $POSTGRES_USER -d $GRAVITINO_DB -f "$schema_file"
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username }}
            - name: GRAVITINO_DB
              value: {{ .Values.postgresql.auth.database }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
          volumeMounts:
            - mountPath: /scripts
              name: scripts-emptydir
      {{- else if and .Values.postgresql.enabled (eq (include "gravitino.schemaWaitEnabled" . | trim) "true") }}
        {{- $pgSchema := include "gravitino.schemaMigrateCurrentSchema" . | trim }}
        - name: init-postgresql
          image: {{ include "init-postgresql.image" . }}
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              VERSION=$(cat /scripts/version.txt)
              if [ -z "$VERSION" ]; then
                echo "ERROR: Please set VERSION (missing /scripts/version.txt)" >&2
                exit 1
              fi
              echo "Waiting for schema version ${VERSION} (written by the schema-migrate Job)..."
              {{- include "gravitino.schemaWaitPreamble" . | nindent 14 }}
              while true; do
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "ERROR: timed out after ${timeout}s waiting for schema version ${VERSION}" >&2
                  exit 1
                fi
                if PGPASSWORD="$POSTGRES_PASSWORD" psql -h {{ .Release.Name }}-postgresql -U "$POSTGRES_USER" -d "$GRAVITINO_DB" -c "SELECT 1" >/dev/null 2>&1; then
                  current=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h {{ .Release.Name }}-postgresql -U "$POSTGRES_USER" -d "$GRAVITINO_DB" -tAc "{{ include "gravitino.schemaReadyQuery" "postgresql" }}" 2>/dev/null | tr -d '[:space:]' || true)
                  if [ "$current" = "$VERSION" ]; then
                    echo "Schema version ${current} is ready."
                    exit 0
                  fi
                  echo "Recorded schema version is '${current:-<none>}'; waiting for ${VERSION}..."
                else
                  echo "Waiting for PostgreSQL to be ready..."
                fi
                sleep 2
              done
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          env:
            - name: SCHEMA_WAIT_TIMEOUT
              value: {{ include "gravitino.schemaWaitTimeoutSeconds" . | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username }}
            - name: GRAVITINO_DB
              value: {{ .Values.postgresql.auth.database }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: password
            {{- if $pgSchema }}
            - name: PGOPTIONS
              value: {{ printf "-c search_path=%s" $pgSchema | quote }}
            {{- end }}
          volumeMounts:
            - mountPath: /scripts
              name: scripts-emptydir
      {{- end }}
      {{- if and (eq (include "gravitino.schemaWaitEnabled" . | trim) "true") (not .Values.mysql.enabled) (not .Values.postgresql.enabled) }}
        {{- $engine := include "gravitino.schemaMigrateEngine" . | trim }}
        {{- $dbHost := include "gravitino.schemaMigrateHost" . | trim }}
        {{- $dbPort := include "gravitino.schemaMigratePort" . | trim }}
        {{- $dbName := include "gravitino.schemaMigrateDatabase" . | trim }}
        {{- $pgSchema := include "gravitino.schemaMigrateCurrentSchema" . | trim }}
        {{- $pgSslMode := include "gravitino.schemaMigrateSslMode" . | trim }}
        {{- $sslCaSecret := include "gravitino.schemaMigrateSslCaSecretName" . | trim }}
        - name: wait-for-schema
          {{- if eq $engine "mysql" }}
          image: {{ include "init-mysql.image" . }}
          {{- else }}
          image: {{ include "init-postgresql.image" . }}
          {{- end }}
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              VERSION=$(cat /scripts/version.txt)
              if [ -z "$VERSION" ]; then
                echo "ERROR: Please set VERSION (missing /scripts/version.txt)" >&2
                exit 1
              fi
              echo "Waiting for schema version ${VERSION} (written by the schema-migrate Job)..."
              {{- include "gravitino.schemaWaitPreamble" . | nindent 14 }}
              while true; do
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "ERROR: timed out after ${timeout}s waiting for schema version ${VERSION}" >&2
                  exit 1
                fi
                {{- if eq $engine "mysql" }}
                if mysql -h "$DB_HOST" -P "$DB_PORT" -u "$MYSQL_USER" -e "SELECT 1" >/dev/null 2>&1; then
                  current=$(mysql -h "$DB_HOST" -P "$DB_PORT" -u "$MYSQL_USER" -D "$GRAVITINO_DB" -sNe "{{ include "gravitino.schemaReadyQuery" "mysql" }}" 2>/dev/null | tr -d '[:space:]' || true)
                  if [ "$current" = "$VERSION" ]; then
                    echo "Schema version ${current} is ready."
                    exit 0
                  fi
                  echo "Recorded schema version is '${current:-<none>}'; waiting for ${VERSION}..."
                else
                  echo "Waiting for MySQL to be ready..."
                fi
                {{- else }}
                if PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$POSTGRES_USER" -d "$GRAVITINO_DB" -c "SELECT 1" >/dev/null 2>&1; then
                  current=$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$POSTGRES_USER" -d "$GRAVITINO_DB" -tAc "{{ include "gravitino.schemaReadyQuery" "postgresql" }}" 2>/dev/null | tr -d '[:space:]' || true)
                  if [ "$current" = "$VERSION" ]; then
                    echo "Schema version ${current} is ready."
                    exit 0
                  fi
                  echo "Recorded schema version is '${current:-<none>}'; waiting for ${VERSION}..."
                else
                  echo "Waiting for PostgreSQL to be ready..."
                fi
                {{- end }}
                sleep 2
              done
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          env:
            - name: SCHEMA_WAIT_TIMEOUT
              value: {{ include "gravitino.schemaWaitTimeoutSeconds" . | quote }}
            - name: DB_HOST
              value: {{ $dbHost | quote }}
            - name: DB_PORT
              value: {{ $dbPort | quote }}
            - name: GRAVITINO_DB
              value: {{ $dbName | quote }}
            {{- if eq $engine "mysql" }}
            - name: MYSQL_USER
              value: {{ .Values.entity.jdbcUser | quote }}
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gravitino.schemaMigrateSecretName" . | trim }}
                  key: {{ .Values.schema.migrate.existingSecretPasswordKey | default "password" }}
            {{- else }}
            - name: POSTGRES_USER
              value: {{ .Values.entity.jdbcUser | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gravitino.schemaMigrateSecretName" . | trim }}
                  key: {{ .Values.schema.migrate.existingSecretPasswordKey | default "password" }}
            {{- if $pgSchema }}
            - name: PGOPTIONS
              value: {{ printf "-c search_path=%s" $pgSchema | quote }}
            {{- end }}
            {{- if $pgSslMode }}
            - name: PGSSLMODE
              value: {{ $pgSslMode | quote }}
            {{- end }}
            {{- if $sslCaSecret }}
            - name: PGSSLROOTCERT
              value: /db-ssl/ca.crt
            {{- end }}
            {{- end }}
          volumeMounts:
            - mountPath: /scripts
              name: scripts-emptydir
            {{- if and (ne $engine "mysql") $sslCaSecret }}
            - name: schema-migrate-ssl
              mountPath: /db-ssl
              readOnly: true
            {{- end }}
      {{- end }}
      containers:
        - name: {{ include "gravitino.name" . }}
          image: {{ include "gravitino.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          command:
            - "/bin/bash"
            - "/tmp/conf/init.sh"
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: GRAVITINO_HOME
              value: /opt/gravitino
            - name: SKIP_CONFIG_REWRITE
              value: "true"
          {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- range $item := .Values.envWithTpl }}
            - name: {{ $item.name }}
              value: {{ tpl $item.value $ | quote }}
          {{- end }}
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- if .Values.extraExposePorts }}
            {{- range $item := .Values.extraExposePorts }}
            - name: {{ $item.name }}
              containerPort: {{ $item.targetPort }}
              protocol: {{ $item.protocol }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: gravitino-conf
              mountPath: /tmp/conf
            - name: storage
              mountPath: {{ .Values.entity.storagePath }}
          {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
          {{- end }}  
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      volumes:
        - name: gravitino-conf
          configMap:
            name: {{ include "gravitino.fullname" . }}
        - emptyDir: {}
          name: scripts-emptydir
        {{- if and (eq (include "gravitino.schemaWaitEnabled" . | trim) "true") (not .Values.mysql.enabled) (not .Values.postgresql.enabled) }}
        {{- $sslCaSecret := include "gravitino.schemaMigrateSslCaSecretName" . | trim }}
        {{- if and (eq (include "gravitino.schemaMigrateEngine" . | trim) "postgresql") $sslCaSecret }}
        - name: schema-migrate-ssl
          secret:
            secretName: {{ $sslCaSecret }}
            items:
              - key: {{ include "gravitino.schemaMigrateSslCaKey" . | trim }}
                path: ca.crt
        {{- end }}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: storage
          emptyDir: {}
        {{- else if .Values.persistence.existingClaim }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- if .Values.extraVolumes }}
          {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}