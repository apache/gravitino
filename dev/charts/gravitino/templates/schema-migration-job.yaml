{{- $isExternalMysql := and .Values.schemaMigration.enabled (not .Values.mysql.enabled) (not .Values.postgresql.enabled) (hasPrefix "jdbc:mysql://" .Values.entity.jdbcUrl) }}
{{- $isExternalPostgresql := and .Values.schemaMigration.enabled (not .Values.mysql.enabled) (not .Values.postgresql.enabled) (hasPrefix "jdbc:postgresql://" .Values.entity.jdbcUrl) }}
{{- if or $isExternalMysql $isExternalPostgresql }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gravitino.fullname" . }}-schema-migration
  namespace: {{ include "gravitino.namespace" . }}
  labels:
    {{- include "gravitino.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.schemaMigration.backoffLimit }}
  {{- if .Values.schemaMigration.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ .Values.schemaMigration.activeDeadlineSeconds }}
  {{- end }}
  {{- if .Values.schemaMigration.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.schemaMigration.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ include "gravitino.name" . }}
        release: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccountName }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: sqlfile
          image: {{ include "gravitino.image" . }}
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command:
            - /bin/bash
            - -c
            - |
              cp -r /opt/gravitino/scripts/*  /tmp/scripts/
              VERSION=$(ls /opt/gravitino/libs/gravitino-server-* | grep -oP '[0-9]+\.[0-9]+\.[0-9]+'|head -1)
              echo $VERSION > /tmp/scripts/version.txt
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          volumeMounts:
            - mountPath: /tmp/scripts/
              name: scripts-emptydir
      containers:
        - name: migrate
          image: {{ if $isExternalMysql }}{{ include "gravitino.imageReference" (dict "imageRoot" .Values.mysql.image "global" .Values.global) }}{{ else }}{{ include "gravitino.imageReference" (dict "imageRoot" .Values.postgresql.image "global" .Values.global) }}{{ end }}
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          command:
            - /bin/bash
            - -c
            - |
              {{- if $isExternalMysql }}
              echo "Waiting for MySQL to be ready..."
              DB_URL=${JDBC_URL#jdbc:mysql://}
              DB_HOST=${DB_URL%%:*}
              DB_PORT=$(echo "$DB_URL" | sed -n 's/^[^:]*:\([0-9]*\)\/.*/\1/p')
              [ -z "$DB_PORT" ] && DB_PORT=3306
              DB_NAME=${DB_URL#*/}
              DB_NAME=${DB_NAME%%\?*}

              attempts=0
              until MYSQL_PWD="$JDBC_PASSWORD" mysql -h "$DB_HOST" -P "$DB_PORT" -u "$JDBC_USER" -e "SELECT 1" >/dev/null 2>&1; do
                attempts=$((attempts+1))
                if [ "$attempts" -ge 60 ]; then
                  echo "ERROR: MySQL is not reachable at $DB_HOST:$DB_PORT after 60 attempts"
                  exit 1
                fi
                echo "Waiting for MySQL to be ready..."
                sleep 2
              done

              VERSION=$(cat /scripts/version.txt)
              if [ -z "$VERSION" ]; then
                echo "ERROR: Please set VERSION"
                exit 1
              fi
              dir="/scripts/mysql"
              schema_file=$(ls $dir/schema-*-mysql.sql | sort -V | awk -F'[-]' '$2 <= '$VERSION' {print $0}' | tail -n 1)
              if [ ! -f "$schema_file" ]; then
                echo "ERROR: Failed to find schema file $schema_file"
                exit 1
              fi
              upgrade_file=$(ls $dir/upgrade-*-to-*-mysql.sql | sort -V | awk -F'[-]' '$4 <= '$VERSION' {print $0}' | tail -n 1)
              if [ ! -f "$upgrade_file" ]; then
                echo "ERROR: Failed to find upgrade file $upgrade_file"
                exit 1
              fi
              echo "Schema file: $schema_file"
              echo "Upgrade file: $upgrade_file"
              if ! MYSQL_PWD="$JDBC_PASSWORD" mysql -h "$DB_HOST" -P "$DB_PORT" -u "$JDBC_USER" -D "$DB_NAME" <"$upgrade_file"; then
                echo "WARNING: Upgrade script failed: $upgrade_file" >&2
                echo "Continuing with schema script..." >&2
              fi
              MYSQL_PWD="$JDBC_PASSWORD" mysql -h "$DB_HOST" -P "$DB_PORT" -u "$JDBC_USER" -D "$DB_NAME" <"$schema_file"
              {{- else }}
              echo "Waiting for PostgreSQL to be ready..."
              DB_URL=${JDBC_URL#jdbc:postgresql://}
              DB_HOST=${DB_URL%%:*}
              DB_PORT=$(echo "$DB_URL" | sed -n 's/^[^:]*:\([0-9]*\)\/.*/\1/p')
              [ -z "$DB_PORT" ] && DB_PORT=5432
              DB_NAME=${DB_URL#*/}
              DB_NAME=${DB_NAME%%\?*}

              attempts=0
              until PGPASSWORD="$JDBC_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$JDBC_USER" -d "$DB_NAME" -c "SELECT 1" >/dev/null 2>&1; do
                attempts=$((attempts+1))
                if [ "$attempts" -ge 60 ]; then
                  echo "ERROR: PostgreSQL is not reachable at $DB_HOST:$DB_PORT after 60 attempts"
                  exit 1
                fi
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done

              VERSION=$(cat /scripts/version.txt)
              if [ -z "$VERSION" ]; then
                echo "ERROR: Please set VERSION"
                exit 1
              fi
              dir="/scripts/postgresql"
              schema_file=$(ls $dir/schema-*-postgresql.sql | sort -V | awk -F'[-]' '$2 <= '$VERSION' {print $0}' | tail -n 1)
              if [ ! -f "$schema_file" ]; then
                echo "ERROR: Failed to find schema file $schema_file"
                exit 1
              fi
              upgrade_file=$(ls $dir/upgrade-*-to-*-postgresql.sql | sort -V | awk -F'[-]' '$4 <= '$VERSION' {print $0}' | tail -n 1)
              if [ ! -f "$upgrade_file" ]; then
                echo "ERROR: Failed to find upgrade file $upgrade_file"
                exit 1
              fi
              echo "Schema file: $schema_file"
              echo "Upgrade file: $upgrade_file"
              if ! PGPASSWORD="$JDBC_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$JDBC_USER" -d "$DB_NAME" -f "$upgrade_file"; then
                echo "WARNING: Upgrade script failed: $upgrade_file" >&2
                echo "Continuing with schema script..." >&2
              fi
              PGPASSWORD="$JDBC_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$JDBC_USER" -d "$DB_NAME" -f "$schema_file"
              {{- end }}
          env:
            - name: JDBC_URL
              value: {{ .Values.entity.jdbcUrl | quote }}
            - name: JDBC_USER
              value: {{ .Values.entity.jdbcUser | quote }}
            - name: JDBC_PASSWORD
              value: {{ .Values.entity.jdbcPassword | quote }}
          resources:
            {{- toYaml .Values.initResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          volumeMounts:
            - mountPath: /scripts
              name: scripts-emptydir
      volumes:
        - name: scripts-emptydir
          emptyDir: {}
{{- end }}
