# Machine config for design-docs/markdown-formatting.md.
# Starts from markdownlint defaults; list only overrides here.

[global]
include = ["design-docs/**/*.md", "dev/ci/markdownlint-fixtures/**/*.md"]
flavor = "gfm"
disable = ["MD040"]
extend-enable = ["MD060"]

[MD013]
line-length = 120
tables = false
code-blocks = false

[MD055]
style = "leading_and_trailing"

[MD060]
enabled = true
style = "aligned"
