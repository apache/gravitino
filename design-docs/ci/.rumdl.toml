# Markdown lint and format settings for the CI design docs.
# Based on rumdl's own config (github.com/rvben/rumdl/.rumdl.toml).
# Check:  rumdl check -c design-docs/ci/.rumdl.toml design-docs/ci
# Format: rumdl fmt   -c design-docs/ci/.rumdl.toml design-docs/ci

[global]
# Cache in build/ next to this file; build/ is git-ignored, so RAT and jj skip it.
cache-dir = "build/rumdl_cache"
# MD041: the Apache license header is an HTML comment before the title.
disable = ["MD041"]

# Wrap prose at 100 columns; `rumdl fmt` reflows paragraphs.
[MD013]
line-length = 100
code-blocks = true
tables = false
headings = true
reflow = true

# Align table columns; a table wider than 100 columns falls back to compact.
[MD060]
enabled = true
style = "aligned"
max-width = 100

[MD055]
style = "leading_and_trailing"

[MD029]
style = "ordered"

[MD046]
style = "fenced"

[MD048]
style = "backtick"

[MD049]
style = "asterisk"

[MD050]
style = "asterisk"

[MD051]
anchor-style = "github"
