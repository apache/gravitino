name: Contrib Catalog Test

# Runs as the contrib-catalog-test stage of presubmit.yml, after the unit test stages pass. One job
# per contrib catalog whose sources, or the shared code it builds on, changed.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      # One filter per module under catalogs-contrib/ (ciVerifyShards fails if one is missing); the
      # job matrix is the list of filters that matched. Shared paths are in every module's filter,
      # so changing them tests every module.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            shared: &shared
              - .github/workflows/contrib-catalog-test.yml
              - catalogs-contrib/build.gradle.kts
              - catalogs/catalog-common/**
              - catalogs/catalog-jdbc-common/**
              - dev/**
              - gradle/**
              - integration-test-common/**
              - build.gradle.kts
              - gradle.properties
              - gradlew
              - settings.gradle.kts
            catalog-jdbc-clickhouse:
              - *shared
              - catalogs-contrib/catalog-jdbc-clickhouse/**
            catalog-jdbc-hologres:
              - *shared
              - catalogs-contrib/catalog-jdbc-hologres/**
            catalog-jdbc-oceanbase:
              - *shared
              - catalogs-contrib/catalog-jdbc-oceanbase/**
    outputs:
      changes: ${{ steps.filter.outputs.changes }}

  contrib-catalog-test:
    name: contrib-catalog-test (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.changes != '[]'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.changes) }}
        exclude:
          - module: shared
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'gradle'

      - uses: ./.github/actions/restore-build-cache

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Check required command
        run: |
          dev/ci/check_commands.sh

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Install dependencies
        run: |
          # libssl1.1 is not in the runner's apt sources, so the .deb is fetched directly.
          deb=libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          for host in archive.ubuntu.com nz2.archive.ubuntu.com security.ubuntu.com; do
            wget --tries=3 --timeout=30 -O "$deb" "https://$host/ubuntu/pool/main/o/openssl/$deb" && break
            rm -f "$deb"
          done
          [ -s "$deb" ] || { echo "Could not download $deb from any mirror" >&2; exit 1; }
          sudo dpkg -i "$deb"

      - name: Run contrib catalog tests
        id: contribCatalogTest
        env:
          GRAVITINO_CLICKHOUSE_TEST_IMAGE: clickhouse:25.8.14.17
        run: ./gradlew :catalogs-contrib:${{ matrix.module }}:test -PskipDockerTests=false -PskipWeb=true

      - name: Upload contrib catalog test reports
        uses: actions/upload-artifact@v7
        if: ${{ (failure() && steps.contribCatalogTest.outcome == 'failure') || contains(github.event.pull_request.labels.*.name, 'upload log') }}
        with:
          name: contrib-catalog-test-reports-${{ matrix.module }}
          path: |
            build/reports
            catalogs-contrib/**/*.log
            catalogs-contrib/**/*.tar
