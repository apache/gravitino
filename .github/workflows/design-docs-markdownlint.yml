name: Design Docs Markdown Lint

# Standalone so path filters on build.yml cannot skip it, and so it does not
# need the run-ci label. Fixture self-check is blocking; design-docs lint is
# warn-only until the baseline format PR.
on:
  pull_request:
    branches: ["main", "branch-*"]
    paths:
      - "design-docs/**"
      - ".rumdl.toml"
      - "gradle/markdownlint.gradle.kts"
      - "dev/ci/test_markdownlint.sh"
      - "dev/ci/markdownlint-fixtures/**"
      - ".github/workflows/design-docs-markdownlint.yml"
  push:
    branches: ["main", "branch-*"]
    paths:
      - "design-docs/**"
      - ".rumdl.toml"
      - "gradle/markdownlint.gradle.kts"
      - "dev/ci/test_markdownlint.sh"
      - "dev/ci/markdownlint-fixtures/**"
      - ".github/workflows/design-docs-markdownlint.yml"

permissions:
  contents: read

concurrency:
  group: design-docs-markdownlint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint-self-check:
    name: markdownlint-self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Run Markdown lint fixture tests
        run: ./gradlew markdownlintSelfCheck -PskipWeb=true

  markdownlint:
    name: markdownlint (warn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Lint design-docs (warn only)
        run: ./gradlew markdownlint -Pmarkdownlint.failOn=never -PskipWeb=true
