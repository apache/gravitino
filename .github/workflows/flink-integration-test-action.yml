name: Flink Integration Test Action

# run flink integration test
on:
  workflow_call:
    inputs:
      base-ref:
        type: string
        required: false
        default: ''
      base-sha:
        type: string
        required: false
        default: ''
      head-repository:
        type: string
        required: false
        default: ''
      head-sha:
        type: string
        required: false
        default: ''
      sync:
        type: string
        required: false
        default: ''
      shard:
        required: false
        description: 'Test shard defined in dev/ci/test-shards.sh; all preserves the complete suite'
        type: string
        default: 'all'
      architecture:
        required: true
        description: 'Architecture of the platform'
        type: string
      java-version:
        required: true
        description: 'Java version'
        type: string

jobs:
  start-runner:
    name: JDK${{ inputs.java-version }}-${{ inputs.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.shard == 'all' && 120 || 90 }}
    env:
      PLATFORM: ${{ inputs.architecture }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-and-sync
        with:
          base-ref: ${{ inputs.base-ref }}
          base-sha: ${{ inputs.base-sha }}
          head-repository: ${{ inputs.head-repository }}
          head-sha: ${{ inputs.head-sha }}
          sync: ${{ inputs.sync }}

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Check required command
        run: |
          dev/ci/check_commands.sh

      - name: Package Gravitino
        run: |
          ./gradlew compileDistribution -PskipWeb=true -x test

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Flink Integration Test
        id: integrationTest
        env:
          TEST_SHARD: ${{ inputs.shard }}
        run: dev/ci/run-integration-shard.sh flink "${TEST_SHARD}"

      - name: Upload integrate tests reports
        uses: actions/upload-artifact@v7
        if: ${{ (failure() && steps.integrationTest.outcome == 'failure') || contains(github.event.pull_request.labels.*.name, 'upload log') }}
        with:
          name: flink-connector-integrate-test-reports-${{ inputs.java-version }}-${{ inputs.shard }}
          path: |
            build/reports
            flink-connector/v1.19/flink/build/*.log
            flink-connector/v1.19/flink/build/*.tar
            flink-connector/v1.20/flink/build/*.log
            flink-connector/v1.20/flink/build/*.tar
            flink-connector/v2.1/flink/build/*.log
            flink-connector/v2.1/flink/build/*.tar
            flink-connector/v2.2/flink/build/*.log
            flink-connector/v2.2/flink/build/*.tar
            distribution/package/logs/gravitino-server.out
            distribution/package/logs/gravitino-server.log
            catalogs/**/*.log
            catalogs/**/*.tar
