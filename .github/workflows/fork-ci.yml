# Run the complete CI entry point from branch pushes in the contributor's repository.
name: Fork CI

on:
  push:
    branches: ['**']

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eligibility:
    name: Resolve fork CI eligibility
    # Downstream mirrors can set this repository variable to keep the
    # inherited workflow completely dormant.
    if: vars.DISABLE_FORK_CI != 'true'
    runs-on: ubuntu-slim
    outputs:
      applicable: ${{ steps.resolve.outputs.applicable }}
      valid: ${{ steps.resolve.outputs.valid == 'true' || steps.merge.outputs.valid == 'true' }}
    steps:
      - name: Resolve repository and pull request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_OWNER: ${{ github.repository_owner }}
          HEAD_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "applicable=false" >> "${GITHUB_OUTPUT}"
          echo "valid=false" >> "${GITHUB_OUTPUT}"

          if [[ "${HEAD_REPOSITORY}" == "apache/gravitino" && \
            ("${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == refs/heads/branch-*) ]]; then
            echo "applicable=true" >> "${GITHUB_OUTPUT}"
            echo "base_ref=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "valid=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          repository_response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${HEAD_REPOSITORY}")"
          source_repository="$(jq -r '.source.full_name // empty' <<< "${repository_response}")"

          if [[ "${HEAD_REPOSITORY}" != "apache/gravitino" && \
            "${source_repository}" != "apache/gravitino" ]]; then
            echo "This repository is not in the apache/gravitino fork network; Fork CI is dormant."
            exit 0
          fi

          echo "applicable=true" >> "${GITHUB_OUTPUT}"
          matches="[]"
          match_count=0
          # Give the contributor a few minutes to open the pull request after pushing.
          for attempt in $(seq 1 12); do
            response="$(curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --get \
              --data-urlencode "state=open" \
              --data-urlencode "head=${HEAD_OWNER}:${HEAD_BRANCH}" \
              --data-urlencode "per_page=10" \
              "https://api.github.com/repos/apache/gravitino/pulls")"
            matches="$(jq -r \
              --arg head_sha "${HEAD_SHA}" \
              --arg head_repository "${HEAD_REPOSITORY}" \
              '[.[] | select(.head.sha == $head_sha and .head.repo.full_name == $head_repository)]' \
              <<< "${response}")"
            match_count="$(jq -r 'length' <<< "${matches}")"
            if [[ "${match_count}" == "1" ]]; then
              break
            fi
            if [[ "${match_count}" != "0" || "${attempt}" == "12" ]]; then
              break
            fi
            sleep 15
          done

          if [[ "${match_count}" == "0" && "${HEAD_REPOSITORY}" == "apache/gravitino" ]]; then
            # Branches in the upstream repository only run for pull requests.
            echo "No open pull request for ${HEAD_BRANCH}; Fork CI is dormant."
            echo "applicable=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          api() {
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/apache/gravitino$1"
          }

          if [[ "${match_count}" == "0" ]]; then
            # No pull request yet: pick the base the same way checkout-and-sync does, the
            # upstream default branch or one of the latest release branches, whichever the
            # commit is fewest commits ahead of. The result is mirrored once the pull request
            # is opened.
            candidates=("$(api "" | jq -r '.default_branch')")
            while IFS= read -r branch; do
              candidates+=("${branch}")
            done < <(api "/branches?per_page=100" \
              | jq -r '.[].name | select(test("^branch-[0-9]+\\.[0-9]+$"))' | sort -V | tail -n 3)
            base_ref=""
            best_ahead=""
            for candidate in "${candidates[@]}"; do
              ahead="$(api "/compare/${candidate}...${HEAD_REPOSITORY/\//:}:${HEAD_SHA}?per_page=1" | jq -r '.ahead_by')"
              if [[ -z "${best_ahead}" || "${ahead}" -lt "${best_ahead}" ]]; then
                base_ref="${candidate}"
                best_ahead="${ahead}"
              fi
            done
            echo "::notice::No open apache/gravitino pull request for ${HEAD_REPOSITORY}:${HEAD_BRANCH} at ${HEAD_SHA}; testing against ${base_ref}. The result is mirrored once the pull request is opened."
          elif [[ "${match_count}" == "1" ]]; then
            base_ref="$(jq -r '.[0].base.ref' <<< "${matches}")"
            echo "Testing ${HEAD_REPOSITORY}:${HEAD_BRANCH} at ${HEAD_SHA} for apache/gravitino#$(jq -r '.[0].number' <<< "${matches}") against ${base_ref}."
          else
            echo "::error::Expected one open apache/gravitino pull request for ${HEAD_REPOSITORY}:${HEAD_BRANCH} at ${HEAD_SHA}, found ${match_count}."
            exit 0
          fi

          echo "base_ref=${base_ref}" >> "${GITHUB_OUTPUT}"
          echo "sync=true" >> "${GITHUB_OUTPUT}"

      # Report a merge conflict once here and skip the suites, instead of starting every
      # suite only for its checkout to fail on the same conflict.
      - name: Check that the commit merges into the base branch
        id: merge
        if: steps.resolve.outputs.sync == 'true'
        env:
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
          HEAD_REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git init --quiet merge-check
          cd merge-check
          git fetch --quiet --no-tags https://github.com/apache/gravitino.git \
            "+refs/heads/${BASE_REF}:refs/remotes/upstream/${BASE_REF}"
          git fetch --quiet --no-tags "https://github.com/${HEAD_REPOSITORY}.git" "${HEAD_SHA}"
          if conflicts="$(git merge-tree --write-tree --name-only --no-messages \
            "refs/remotes/upstream/${BASE_REF}" "${HEAD_SHA}")"; then
            echo "valid=true" >> "${GITHUB_OUTPUT}"
          else
            # The first line is the merged tree; the rest are the conflicting files.
            tail -n +2 <<< "${conflicts}" | sed 's/^/Conflict: /'
            echo "::error::${HEAD_SHA} does not merge cleanly into ${BASE_REF}, so the suites were skipped. Merge or rebase onto the latest ${BASE_REF} and push again."
          fi

      - name: Reject an unmatched Apache fork branch
        if: >-
          steps.resolve.outputs.applicable == 'true' &&
          steps.resolve.outputs.valid != 'true' && steps.merge.outputs.valid != 'true'
        run: exit 1

  build:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/build.yml

  backend:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/backend-integration-test.yml

  spark:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/spark-integration-test.yml

  flink:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/flink-integration-test.yml

  trino:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/trino-integration-test.yml

  iceberg_rest_trino:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/iceberg-rest-trino-integration-test.yml

  python:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/python-integration-test.yml

  frontend:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/frontend-integration-test.yml

  access_control:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/access-control-integration-test.yml

  idp_basic:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/idp-basic-test.yml

  mcp:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/mcp-integration-test.yml

  maintenance:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/maintenance-integration-test.yml

  web_ui:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/web-ui-tests.yml

  charts:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/chart-test.yaml

  contrib_catalog:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/contrib-catalog-test.yml

  asf_allowlist:
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    uses: ./.github/workflows/asf-allowlist-check.yml

  required_ci:
    name: Required CI
    # !cancelled() rather than always(), so a cancelled run does not wait for a runner here.
    if: ${{ !cancelled() && needs.eligibility.outputs.applicable == 'true' }}
    needs:
      - eligibility
      - build
      - backend
      - spark
      - flink
      - trino
      - iceberg_rest_trino
      - python
      - frontend
      - access_control
      - idp_basic
      - mcp
      - maintenance
      - web_ui
      - charts
      - contrib_catalog
      - asf_allowlist
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI suites
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "Required CI suite results:"
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "${RESULTS}"
          failures="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success" and .value.result != "skipped")
              | "\(.key)=\(.value.result)"
            ' <<< "${RESULTS}"
          )"
          if [ -n "${failures}" ]; then
            echo "::error::One or more required CI suites did not succeed."
            echo "${failures}"
            exit 1
          fi
