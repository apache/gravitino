name: TMS Test Action

on:
  workflow_call:
    inputs:
      java-version:
        required: true
        description: 'Java version'
        type: string

jobs:
  tms-test:
    name: JDK${{ inputs.java-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: "temurin"
          cache: "gradle"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Check required command
        run: |
          dev/ci/check_commands.sh

      - name: Package Gravitino
        run: |
          ./gradlew compileDistribution -PskipWeb=true -x test

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Run TMS plugin tests
        id: tmsTest
        env:
          dockerTest: true
        run: |
          set -euo pipefail

          # Unit and in-process tests (no Docker, no REST IT).
          ./gradlew :plugins:maintenance:test -PskipITs -PskipDockerTests=true

          # REST IT: embedded and deploy, each against h2 / MySQL / PostgreSQL.
          for test_mode in embedded deploy; do
            for backend in h2 mysql postgresql; do
              ./gradlew :plugins:maintenance:test \
                -PtestMode="${test_mode}" \
                -PjdbcBackend="${backend}" \
                -PskipDockerTests=false \
                --tests "org.apache.gravitino.maintenance.integration.test.**"
            done
          done

      - name: Upload TMS plugin test reports
        uses: actions/upload-artifact@v7
        if: ${{ (failure() && steps.tmsTest.outcome == 'failure') || contains(github.event.pull_request.labels.*.name, 'upload log') }}
        with:
          name: tms-test-reports
          path: |
            plugins/maintenance/build/reports
            plugins/maintenance/build/test-results
            distribution/package-all/logs/gravitino-server.out
            distribution/package-all/logs/gravitino-server.log
            distribution/package/logs/gravitino-server.out
            distribution/package/logs/gravitino-server.log
