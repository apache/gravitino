name: CLI Integration Test Action

# Runs the command line client's integration tests against a Gravitino server.
on:
  workflow_call:
    inputs:
      java-version:
        required: true
        description: 'Java version'
        type: string
      test-mode:
        required: true
        description: 'Server mode: embedded or deploy'
        type: string

jobs:
  start-runner:
    name: JDK${{ inputs.java-version }}-${{ inputs.test-mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - uses: ./.github/actions/restore-build-cache

      - name: Package Gravitino
        run: ./gradlew compileDistribution -PskipWeb=true -x test

      - name: CLI Integration Test
        id: integrationTest
        run: ./gradlew :clients:cli:test -PskipTests -PtestMode=${{ inputs.test-mode }} -PskipWeb=true

      - name: Upload integrate tests reports
        uses: actions/upload-artifact@v7
        if: ${{ (failure() && steps.integrationTest.outcome == 'failure') || contains(github.event.pull_request.labels.*.name, 'upload log') }}
        with:
          name: cli-integrate-test-reports-${{ inputs.java-version }}-${{ inputs.test-mode }}
          path: |
            build/reports
            clients/cli/build/reports
            clients/cli/build/*.log
            distribution/package/logs/gravitino-server.out
            distribution/package/logs/gravitino-server.log
