name: IdP Basic Test

on:
  workflow_call:
    inputs:
      required_ci:
        description: Run this suite as part of the Required CI orchestrator.
        required: false
        type: boolean
        default: false
  push:
    branches: ["main", "branch-*"]
  workflow_dispatch:

concurrency:
  group: required-idp-basic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            source_changes:
              - plugins/idp-basic/**
              - clients/client-java/**
              - clients/client-java-runtime/**
              - integration-test-common/**
              - core/**
              - gradle/**
              - gradlew
              - dev/**
              - build.gradle.kts
              - gradle.properties
              - settings.gradle.kts
              - .github/workflows/idp-basic-test.yml
              - .github/workflows/idp-basic-test-action.yml
      - name: Detect idp-basic module
        id: module
        run: |
          if [ -f plugins/idp-basic/build.gradle.kts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      source_changes: ${{ steps.filter.outputs.source_changes }}
      module_exists: ${{ steps.module.outputs.exists }}

  idp-basic-test:
    needs: changes
    if: needs.changes.outputs.source_changes == 'true' && needs.changes.outputs.module_exists == 'true'
    uses: ./.github/workflows/idp-basic-test-action.yml
    with:
      java-version: '17'
