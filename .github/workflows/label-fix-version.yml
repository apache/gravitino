# Label issues with the release their fix ships in, see
# dev/ci/label_fix_version.sh for details.
#
# - When a PR is merged, its issues get the version of the merge commit,
#   e.g. main (2.0.0-SNAPSHOT) -> "2.0.0". The PR and its issues are assigned
#   to the PR author if they have no assignee.
# - The release script bumps to the next SNAPSHOT right after tagging an RC,
#   so when a later RC is tagged, the issues fixed since the previous RC are
#   moved to that release, e.g. v1.3.1-rc2 moves them from "1.3.2" to "1.3.1".
#
# The merge job uses pull_request_target so that PRs from forks get a token
# that can write labels. It never checks out PR code, and all PR-controlled
# values are passed through env to avoid script injection.

name: Label issues with fix version

on:
  pull_request_target:
    types: [closed]
  push:
    tags:
      - 'v*-rc*'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label-on-merge:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Only the trusted default branch, never the PR head.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Label linked issues and assign the PR author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: dev/ci/label_fix_version.sh merge

  label-on-rc:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Move issues fixed since the previous RC to this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: dev/ci/label_fix_version.sh rc
