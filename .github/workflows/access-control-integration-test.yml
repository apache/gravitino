name: Access Control Integration Test

# Controls when the workflow will run
on:
  # Triggered by the Required CI orchestrator (workflow_call) or by pushes.
  workflow_call:
    inputs:
      required_ci:
        description: Run this suite as part of the Required CI orchestrator.
        required: false
        type: boolean
        default: false
  push:
    branches: [ "main", "branch-*" ]

concurrency:
  group: required-access-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            source_changes:
              - .github/**
              - api/**
              - authorizations/**
              - bin/**
              - catalogs/**
              - clients/client-java/**
              - clients/client-java-runtime/**
              - common/**
              - conf/**
              - core/**
              - dev/**
              - gradle/**
              - iceberg/**
              - integration-test-common/**
              - meta/**
              - scripts/**
              - server/**
              - server-common/**
              - build.gradle.kts
              - gradle.properties
              - gradlew
              - settings.gradle.kts
    outputs:
      source_changes: ${{ steps.filter.outputs.source_changes }}

  access-control-IT:
    needs: changes
    if: needs.changes.outputs.source_changes == 'true'
    strategy:
      matrix:
        architecture: [linux/amd64]
        java-version: [ 17 ]
    uses: ./.github/workflows/access-control-integration-test-action.yml
    with:
      architecture: ${{ matrix.architecture }}
      java-version: ${{ matrix.java-version }}
