name: Cherry-pick to fork

on:
  workflow_call:
    inputs:
      target-branch:
        required: true
        type: string
      task:
        description: 'Verified source PR, merger, fork and immutable source commit'
        required: true
        type: string
    secrets:
      CHERRY_PICK_TOKEN:
        required: false
      BACKPORT_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Cherry-pick to ${{ inputs.target-branch }} in merger fork
    env:
      BACKPORT_TASK: ${{ inputs.task }}
      BACKPORT_TARGET: ${{ inputs.target-branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Authorize only the merger's fork
        id: token
        uses: actions/github-script@v7
        env:
          APP_ID: ${{ vars.BACKPORT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BACKPORT_APP_PRIVATE_KEY }}
        with:
          script: |
            await require('./.github/scripts/backport-to-fork.cjs').installationToken({
              appRequest: new github.constructor().request, core, task: JSON.parse(process.env.BACKPORT_TASK),
              appId: process.env.APP_ID, privateKey: process.env.APP_PRIVATE_KEY });
      - name: Prepare or reuse the backport branch
        id: prepare
        uses: actions/github-script@v7
        env:
          FORK_TOKEN: ${{ steps.token.outputs.token }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            await require('./.github/scripts/backport-to-fork.cjs').prepare({ github, core,
              task: JSON.parse(process.env.BACKPORT_TASK), target: process.env.BACKPORT_TARGET,
              token: process.env.FORK_TOKEN });
      - name: Open or reuse the Apache pull request
        id: pr
        uses: actions/github-script@v7
        env:
          BACKPORT_BRANCH: ${{ steps.prepare.outputs.branch }}
          BACKPORT_MARKERS: ${{ steps.prepare.outputs.markers }}
          BACKPORT_CONFLICT: ${{ steps.prepare.outputs.conflict }}
        with:
          github-token: ${{ secrets.CHERRY_PICK_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            await require('./.github/scripts/backport-to-fork.cjs').openPullRequest({ github, core,
              task: JSON.parse(process.env.BACKPORT_TASK), target: process.env.BACKPORT_TARGET,
              branch: process.env.BACKPORT_BRANCH, conflict: process.env.BACKPORT_CONFLICT === 'true',
              markers: process.env.BACKPORT_MARKERS === 'true' });
      - name: Start CI in the fork after the PR exists
        if: steps.pr.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          BACKPORT_BRANCH: ${{ steps.prepare.outputs.branch }}
          BACKPORT_SHA: ${{ steps.prepare.outputs.sha }}
          BACKPORT_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            await require('./.github/scripts/backport-to-fork.cjs').dispatch({ github, core,
              task: JSON.parse(process.env.BACKPORT_TASK), target: process.env.BACKPORT_TARGET,
              branch: process.env.BACKPORT_BRANCH, sha: process.env.BACKPORT_SHA,
              number: process.env.BACKPORT_NUMBER });
      - name: Revoke fork credentials
        if: always() && steps.token.outputs.token != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            await github.request('DELETE /installation/token');
