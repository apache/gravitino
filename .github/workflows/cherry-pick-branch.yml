name: Cherry-pick to configured repository

on:
  workflow_call:
    inputs:
      target-branch:
        required: true
        type: string
      task:
        description: 'Verified source PR, destination and immutable source commit'
        required: true
        type: string
    secrets:
      BACKPORT_BOT_TOKEN:
        required: false
      CHERRY_PICK_TOKEN:
        required: false

# Inherit read-only Contents in bot mode, write Contents/Actions in upstream mode.
# The caller grants only the permissions needed for the selected destination.

jobs:
  cherry-pick:
    concurrency:
      group: backport-pr-${{ fromJSON(inputs.task).number }}-${{ inputs.target-branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Cherry-pick to ${{ inputs.target-branch }} in ${{ fromJSON(inputs.task).owner }}/gravitino
    env:
      BACKPORT_TASK: ${{ inputs.task }}
      BACKPORT_TARGET: ${{ inputs.target-branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify the dedicated bot credential
        if: fromJSON(inputs.task).owner != 'apache'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BACKPORT_BOT_TOKEN }}
          script: |
            await require('./.github/scripts/backport-to-fork.cjs').verifyBot({
              github, task: JSON.parse(process.env.BACKPORT_TASK) });
      - name: Prepare or reuse the backport branch
        id: prepare
        uses: actions/github-script@v7
        env:
          FORK_TOKEN: ${{ fromJSON(inputs.task).owner == 'apache' && (secrets.CHERRY_PICK_TOKEN || github.token) || secrets.BACKPORT_BOT_TOKEN }}
        with:
          github-token: ${{ fromJSON(inputs.task).owner == 'apache' && (secrets.CHERRY_PICK_TOKEN || github.token) || secrets.BACKPORT_BOT_TOKEN }}
          script: |
            await require('./.github/scripts/backport-to-fork.cjs').prepare({ github, core,
              task: JSON.parse(process.env.BACKPORT_TASK), target: process.env.BACKPORT_TARGET,
              token: process.env.FORK_TOKEN });
      - name: Open or reuse the Apache pull request
        id: pr
        uses: actions/github-script@v7
        env:
          UPSTREAM_TOKEN: ${{ github.token }}
          BACKPORT_BRANCH: ${{ steps.prepare.outputs.branch }}
          BACKPORT_MARKERS: ${{ steps.prepare.outputs.markers }}
          BACKPORT_CONFLICT: ${{ steps.prepare.outputs.conflict }}
        with:
          github-token: ${{ fromJSON(inputs.task).owner == 'apache' && (secrets.CHERRY_PICK_TOKEN || github.token) || secrets.BACKPORT_BOT_TOKEN }}
          script: |
            await require('./.github/scripts/backport-to-fork.cjs').openPullRequest({ github, upstream: new github.constructor({ auth: process.env.UPSTREAM_TOKEN }), core,
              task: JSON.parse(process.env.BACKPORT_TASK), target: process.env.BACKPORT_TARGET,
              branch: process.env.BACKPORT_BRANCH, conflict: process.env.BACKPORT_CONFLICT === 'true',
              markers: process.env.BACKPORT_MARKERS === 'true' });
      - name: Start CI after the PR exists
        if: steps.pr.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          BACKPORT_BRANCH: ${{ steps.prepare.outputs.branch }}
          BACKPORT_SHA: ${{ steps.prepare.outputs.sha }}
          BACKPORT_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          github-token: ${{ fromJSON(inputs.task).owner == 'apache' && (secrets.CHERRY_PICK_TOKEN || github.token) || secrets.BACKPORT_BOT_TOKEN }}
          script: |
            await require('./.github/scripts/backport-to-fork.cjs').dispatch({ github, core,
              task: JSON.parse(process.env.BACKPORT_TASK), target: process.env.BACKPORT_TARGET,
              branch: process.env.BACKPORT_BRANCH, sha: process.env.BACKPORT_SHA,
              number: process.env.BACKPORT_NUMBER });
