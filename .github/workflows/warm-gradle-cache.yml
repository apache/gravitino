name: Warm Gradle cache

on:
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * *'

permissions:
  contents: read

concurrency:
  group: warm-gradle-cache
  cancel-in-progress: false

jobs:
  warm:
    if: >-
      github.event.repository.fork && vars.DISABLE_FORK_CI != 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Fork CI merges feature branches onto upstream main before setup-java hashes the build files.
      - uses: actions/checkout@v4
        with:
          repository: apache/gravitino
          ref: main
          persist-credentials: false

      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Compile core test classes to populate the dependency cache
        if: steps.java.outputs.cache-hit != 'true'
        run: ./gradlew :core:testClasses -PskipWeb=true
