      scala-version: ${{ matrix.scala-version }}
      test-mode: ${{ matrix.test-mode }}

  trino-it:
    needs: [ changes, test, medium-test, core-test ]
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs['medium-test'].result) &&
      contains(fromJSON('["success", "skipped"]'), needs['core-test'].result) &&
      needs.changes.outputs.trino_it == 'true'
    strategy:
      matrix:
        architecture: [ linux/amd64 ]
        java-version: [ 17 ]
    uses: ./.github/workflows/trino-integration-test-action.yml
    with:
      architecture: ${{ matrix.architecture }}
      java-version: ${{ matrix.java-version }}

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ changes, test, medium-test, core-test ]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.test.result == 'success' &&
      (needs.changes.outputs.maintenance_module_only_changes == 'true' ||
      (needs['medium-test'].result == 'success' && needs['core-test'].result == 'success'))
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        if: needs.changes.outputs.maintenance_module_only_changes != 'true'
        with:
          java-version: 17

      - name: Fetch base branch for coverage diff
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          merge-multiple: true

      - name: Download core test evidence
        if: needs.changes.outputs.maintenance_module_only_changes != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: core-*-test-evidence
          path: core-test-evidence

      - name: Generate combined core coverage
        if: needs.changes.outputs.maintenance_module_only_changes != 'true'
        run: |
          mkdir -p core/build/jacoco
          for task in coreUnitTest coreH2Test coreMySQLTest corePostgreSQLTest; do
            exec_file="$(find core-test-evidence -path "*/core/build/jacoco/${task}.exec" -print -quit)"
            test -n "${exec_file}"
            install -m 0644 "${exec_file}" "core/build/jacoco/${task}.exec"
          done
          ./gradlew \
            :core:jacocoTestReport \
            -PcoreSuiteCoverage=true \
            -PskipWeb=true
          test -s core/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Generate Coverage Report
        id: coverage
        run: |
          python3 dev/ci/jacoco_report.py \
            --base-ref "${{ github.base_ref }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --repo-url "${{ github.event.pull_request.head.repo.html_url }}" \
            --min-overall 40 \
            --min-changed 60 \
            --output coverage-report.md

      - name: Save PR number
        if: steps.coverage.outputs.has_reports == 'true'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload Coverage Report
        if: steps.coverage.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage-report.md
            pr-number.txt

      - name: Output Coverage Info
        if: steps.coverage.outputs.has_reports == 'true'
        run: |
          echo "Total coverage ${{ steps.coverage.outputs.coverage-overall }}"
          echo "Changed Files coverage ${{ steps.coverage.outputs.coverage-changed-files }}"
