name: presubmit

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "branch-*" ]
    paths-ignore:
      - 'docs/assets/**'
      - 'web-v2/**'
  pull_request:
    branches: [ "main", "branch-*" ]
    paths-ignore:
      - 'docs/assets/**'
      - 'web-v2/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test source license-reference checker
        run: bash dev/release/test-check-license.sh
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          list-files: shell
          filters: |
            source_changes:
              - '.github/**'
              - 'catalogs/**'
              - 'catalogs-contrib/**'
              - 'clients/**'
              - 'conf/**'
              - 'dev/**'
              - 'docs/open-api/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'meta/**'
              - 'scripts/**'
              - 'web/**'
              - '**/*.java'
              - '**/*.kts'
              - '**/*.py'
              - '**/*.rs'
              - '**/resources/**'
              - '**/src/**'
              - '**/*.md'
              - '**/*.mdx'
              - '!docs/**/*.png'
              - '!docs/**/*.svg'
              - '!docs/**/*.jpg'
              - '!docs/**/*.jpeg'
              - '!docs/**/*.gif'
              - '!docs/**/*.webp'
              - 'mcp-server/**'
            spark_connector_changes:
              - spark-connector/**
            mcp_server_changes:
              - mcp-server/**
            access_control_it:
              - '.github/**'
              - 'api/**'
              - 'authorizations/**'
              - 'bin/**'
              - 'catalogs/**'
              - 'clients/client-java/**'
              - 'clients/client-java-runtime/**'
              - 'common/**'
              - 'conf/**'
              - 'core/**'
              - 'dev/**'
              - 'gradle/**'
              - 'iceberg/**'
              - 'integration-test-common/**'
              - 'meta/**'
              - 'scripts/**'
              - 'server/**'
              - 'server-common/**'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'settings.gradle.kts'
            backend_it:
              - '.github/**'
              - 'api/**'
              - 'bin/**'
              - 'catalogs/**'
              - 'clients/client-java/**'
              - 'clients/client-java-runtime/**'
              - 'clients/filesystem-hadoop3/**'
              - 'clients/cli/**'
              - 'common/**'
              - 'conf/**'
              - 'core/**'
              - 'lance/**'
              - 'dev/**'
              - 'gradle/**'
              - 'iceberg/**'
              - 'integration-test-common/**'
              - 'meta/**'
              - 'scripts/**'
              - 'server/**'
              - 'bundles/**'
              - 'server-common/**'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'settings.gradle.kts'
            flink_it:
              - '.github/**'
              - 'api/**'
              - 'bin/**'
              - 'catalogs/**'
              - 'clients/client-java/**'
              - 'clients/client-java-runtime/**'
              - 'common/**'
              - 'conf/**'
              - 'core/**'
              - 'dev/**'
              - 'flink-connector/**'
              - 'gradle/**'
              - 'integration-test-common/**'
              - 'meta/**'
              - 'scripts/**'
              - 'server/**'
              - 'server-common/**'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'settings.gradle.kts'
            iceberg_rest_trino_it:
              - '.github/**'
              - 'api/**'
              - 'catalogs/catalog-common/**'
              - 'clients/client-java/**'
              - 'common/**'
              - 'core/**'
              - 'server-common/**'
              - 'iceberg/**'
              - 'integration-test-common/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'settings.gradle.kts'
            idp_basic_it:
              - 'plugins/idp-basic/**'
              - 'clients/client-java/**'
              - 'clients/client-java-runtime/**'
              - 'integration-test-common/**'
              - 'core/**'
              - 'gradle/**'
              - 'gradlew'
              - 'dev/**'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'settings.gradle.kts'
              - '.github/workflows/presubmit.yml'
              - '.github/workflows/idp-basic-test-action.yml'
            maintenance_it:
              - '.github/**'
              - 'api/**'
              - 'bin/**'
              - 'catalogs/catalog-common/**'
              - 'clients/client-java/**'
              - 'clients/client-java-runtime/**'
              - 'common/**'
              - 'conf/**'
              - 'core/**'
              - 'dev/**'
              - 'gradle/**'
              - 'integration-test-common/**'
              - 'maintenance/**'
              - 'meta/**'
              - 'scripts/**'
              - 'server/**'
              - 'server-common/**'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'settings.gradle.kts'
            cli_it:
              - '.github/workflows/presubmit.yml'
              - '.github/workflows/cli-integration-test-action.yml'
              - 'api/**'
              - 'bin/**'
              - 'catalogs/catalog-common/**'
              - 'catalogs/catalog-jdbc-common/**'
              - 'catalogs/catalog-jdbc-postgresql/**'
              - 'clients/cli/**'
              - 'clients/client-java/**'
              - 'common/**'
              - 'conf/**'
              - 'core/**'
              - 'gradle/**'
              - 'integration-test-common/**'
              - 'server/**'
              - 'server-common/**'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'settings.gradle.kts'
            mcp_it:
              - 'mcp-server/**'
              - 'server/**'
              - 'core/src/main/java/org/apache/gravitino/authorization/**'
              - 'server-common/src/main/java/org/apache/gravitino/server/authentication/**'
              - '.github/workflows/presubmit.yml'
              - '.github/workflows/mcp-integration-test-action.yml'
            python_it:
              - '.github/**'
              - 'api/**'
              - 'authorizations/**'
              - 'bin/**'
              - 'catalogs/**'
              - 'clients/client-python/**'
              - 'common/**'
              - 'conf/**'
              - 'core/**'
              - 'dev/**'
              - 'gradle/**'
              - 'iceberg/**'
              - 'meta/**'
              - 'scripts/**'
              - 'server/**'
              - 'server-common/**'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'settings.gradle.kts'
            spark_it:
              - '.github/**'
              - 'api/**'
              - 'bin/**'
              - 'catalogs/**'
              - 'clients/client-java/**'
              - 'clients/client-java-runtime/**'
              - 'common/**'
              - 'conf/**'
              - 'core/**'
              - 'dev/**'
              - 'gradle/**'
              - 'iceberg/**'
              - 'integration-test-common/**'
              - 'meta/**'
              - 'scripts/**'
              - 'server/**'
              - 'server-common/**'
              - 'spark-connector/**'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'settings.gradle.kts'
            trino_it:
              - '.github/**'
              - 'api/**'
              - 'bin/**'
              - 'catalogs/**'
              - 'clients/client-java/**'
              - 'clients/client-java-runtime/**'
              - 'common/**'
              - 'conf/**'
              - 'core/**'
              - 'dev/**'
              - 'gradle/**'
              - 'iceberg/**'
              - 'integration-test-common/**'
              - 'meta/**'
              - 'scripts/**'
              - 'server/**'
              - 'server-common/**'
              - 'trino-connector/**'
              - 'build.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'settings.gradle.kts'
      - name: Determine maintenance-module-only changes
        id: maintenance_module_only
        env:
          SOURCE_CHANGE_FILES: ${{ steps.filter.outputs.source_changes_files }}
        run: |
          # Route to the maintenance-only build path only when every source
          # change in the PR is under maintenance/. Non-source changes are
          # already filtered out by source_changes_files.
          source_files=()
          if [ -n "${SOURCE_CHANGE_FILES}" ]; then
            eval "source_files=(${SOURCE_CHANGE_FILES})"
          fi

          maintenance_module_only=false
          if [ "${#source_files[@]}" -gt 0 ]; then
            maintenance_module_only=true
            for path in "${source_files[@]}"; do
              case "$path" in
                maintenance/*) ;;
                *)
                  maintenance_module_only=false
                  break
                  ;;
              esac
            done
          fi

          echo "maintenance_module_only_changes=${maintenance_module_only}" >> "${GITHUB_OUTPUT}"
      - name: Detect idp-basic module
        id: idp_basic_module
        run: echo "exists=${{ hashFiles('plugins/idp-basic/build.gradle.kts') != '' }}" >> "${GITHUB_OUTPUT}"
    outputs:
      source_changes: ${{ steps.filter.outputs.source_changes }}
      spark_connector_changes: ${{ steps.filter.outputs.spark_connector_changes }}
      mcp_server_changes: ${{ steps.filter.outputs.mcp_server_changes }}
      maintenance_module_only_changes: ${{ steps.maintenance_module_only.outputs.maintenance_module_only_changes }}
      access_control_it: ${{ steps.filter.outputs.access_control_it }}
      backend_it: ${{ steps.filter.outputs.backend_it }}
      cli_it: ${{ steps.filter.outputs.cli_it }}
      flink_it: ${{ steps.filter.outputs.flink_it }}
      iceberg_rest_trino_it: ${{ steps.filter.outputs.iceberg_rest_trino_it }}
      idp_basic_it: ${{ steps.filter.outputs.idp_basic_it }}
      maintenance_it: ${{ steps.filter.outputs.maintenance_it }}
      mcp_it: ${{ steps.filter.outputs.mcp_it }}
      python_it: ${{ steps.filter.outputs.python_it }}
      spark_it: ${{ steps.filter.outputs.spark_it }}
      trino_it: ${{ steps.filter.outputs.trino_it }}
      idp_basic_module_exists: ${{ steps.idp_basic_module.outputs.exists }}

  compile-check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.source_changes != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      - name: Build with Gradle
        run: |
          ./gradlew assemble -PskipWeb=true

  # To check the spark-connector is compatible with scala2.13
  spark-connector-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.spark_connector_changes == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'gradle'

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Build with Scala2.13
        run: |
          ./gradlew :spark-connector:spark-3.5:build -PscalaVersion=2.13 -PskipITs -PskipDockerTests=false -PskipWeb=true

      - name: Upload unit tests report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit test report
          path: |
            build/reports
            spark-connector/**/*.log

  # Presubmit runs in stages, cheapest first: lint, build, small tests, medium tests (Docker)
  # next to the core lanes, then the integration tests. Each stage needs the one before, so a PR
  # that fails lint stops there; jobs within a stage run in parallel. The unit test stages are
  # Gradle tasks defined in gradle/ci-stages.gradle.kts.
  lint:
    name: lint (jvm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.source_changes == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      - name: Lint
        run: ./gradlew ciLint -PskipWeb=true

  lint-workflows:
    name: lint (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # actionlint runs ShellCheck (on the runner image) on every run: block. Warnings and up only:
      # the cherry-pick and docker-image workflows have about 70 info and style findings.
      - name: Lint workflows
        env:
          SHELLCHECK_OPTS: --severity=warning
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  lint-shell:
    name: lint (shell)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ShellCheck ships on the GitHub runner image; .shellcheckrc holds the settings. Errors only
      # for now: warnings and below have hundreds of existing findings.
      - name: Lint shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error

  lint-docs:
    name: lint (docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Only the CI design docs have a rumdl config so far.
      - name: Lint Markdown
        run: pipx run rumdl==0.3.0 check -c design-docs/ci/.rumdl.toml design-docs/ci

  lint-web:
    name: lint (web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.source_changes == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      # The Gradle node plugin downloads Node and pnpm, so this needs no Node setup step.
      - name: Lint web UIs
        run: >-
          ./gradlew
          :web:web:lintCheck :web:web:prettierCheck
          :web-v2:web:lintCheck :web-v2:web:prettierCheck

  lint-python:
    name: lint (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.source_changes == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      # Gradle installs its own Python for both projects.
      - name: Lint Python
        run: >-
          ./gradlew -PskipWeb=true
          :clients:client-python:blackCheck :clients:client-python:pylint
          :mcp-server:formatCheckPython :mcp-server:pylint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ changes, lint, lint-workflows, lint-python, lint-shell, lint-docs, lint-web ]
    if: needs.changes.outputs.source_changes == 'true'
    outputs:
      medium-shards: ${{ steps.shards.outputs.medium-shards }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      - name: Test publish to local
        run: ./gradlew publishToMavenLocal -PskipWeb=true -x test

      # testClasses compiles the test sources too, so a test that does not compile fails here.
      # shadedJarTest is a test that `check` runs; it runs in the test stage instead.
      - name: Build without tests
        run: >-
          ./gradlew build testClasses -x test
          -x :plugins:k8s-job-executor:shadedJarTest
          -PskipWeb=true
          -x :clients:client-python:build
          ${{ needs.changes.outputs.mcp_server_changes != 'true' && '-x :mcp-server:build -x :mcp-server:pylint -x :web-v2:web:build' || '' }}

      - name: List medium test shards
        id: shards
        run: ./gradlew ciShards -PskipWeb=true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 17 ]
    timeout-minutes: 120
    needs: [ changes, build ]
    if: needs.changes.outputs.source_changes == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: ${{ matrix.java-version }}

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Install dependencies
        run: |
          # libssl1.1 is not in the runner's apt sources, so the .deb is fetched directly.
          deb=libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          for host in archive.ubuntu.com nz2.archive.ubuntu.com security.ubuntu.com; do
            wget --tries=3 --timeout=30 -O "$deb" "https://$host/ubuntu/pool/main/o/openssl/$deb" && break
            rm -f "$deb"
          done
          [ -s "$deb" ] || { echo "Could not download $deb from any mirror" >&2; exit 1; }
          sudo dpkg -i "$deb"

      - name: Run maintenance module tests
        if: needs.changes.outputs.maintenance_module_only_changes == 'true'
        run: >-
          ./gradlew
          :maintenance:optimizer-api:build
          :maintenance:updaters:build
          :maintenance:optimizer:build
          :maintenance:jobs:build
          -PskipWeb=true
          -PskipITs
          -PskipDockerTests=false

      - name: Run small tests
        if: needs.changes.outputs.maintenance_module_only_changes != 'true'
        run: >-
          ./gradlew ciSmallTest
          --max-workers=2
          -PskipWeb=true
          -PskipITs
          -PskipDockerTests=false
          ${{ needs.changes.outputs.mcp_server_changes != 'true' && '-x :mcp-server:test' || '' }}

      - name: Upload coverage data
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-test
          # build.gradle.kts anchors the artifact at the repository root, so the report paths keep
          # their module prefix, which jacoco_report.py uses to name modules.
          path: |
            build.gradle.kts
            **/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload unit tests report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit test report
          path: |
            build/reports
            catalogs-contrib/**/*.log
            catalogs-contrib/**/*.tar
            catalogs/**/*.log
            catalogs/**/*.tar

  medium-test:
    name: medium-test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Shards and their modules are defined in gradle/ci-stages.gradle.kts.
        include: ${{ fromJSON(needs.build.outputs.medium-shards) }}
    timeout-minutes: 120
    needs: [ changes, build, test ]
    if: >-
      needs.changes.outputs.source_changes == 'true' &&
      needs.changes.outputs.maintenance_module_only_changes != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Install dependencies
        run: |
          # libssl1.1 is not in the runner's apt sources, so the .deb is fetched directly.
          deb=libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          for host in archive.ubuntu.com nz2.archive.ubuntu.com security.ubuntu.com; do
            wget --tries=3 --timeout=30 -O "$deb" "https://$host/ubuntu/pool/main/o/openssl/$deb" && break
            rm -f "$deb"
          done
          [ -s "$deb" ] || { echo "Could not download $deb from any mirror" >&2; exit 1; }
          sudo dpkg -i "$deb"

      - name: Run medium ${{ matrix.shard }} tests
        run: >-
          ./gradlew ${{ matrix.task }}
          --max-workers=2
          -PskipWeb=true
          -PskipITs
          -PskipDockerTests=false

      - name: Upload coverage data
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-medium-${{ matrix.shard }}
          path: |
            build.gradle.kts
            **/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload unit tests report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: medium test report ${{ matrix.shard }}
          path: |
            build/reports
            catalogs/**/*.log
            catalogs/**/*.tar

  core-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 17 ]
        # One job per core test lane, so each lane's results and coverage inputs are inspectable on
        # their own. Lanes are defined in core/build.gradle.kts.
        lane: [ unit, h2, mysql, postgresql ]
        include:
          - lane: unit
            task: coreUnitTest
            skip-docker-tests: true
          - lane: h2
            task: coreH2Test
            skip-docker-tests: true
          - lane: mysql
            task: coreMySQLTest
            skip-docker-tests: false
          - lane: postgresql
            task: corePostgreSQLTest
            skip-docker-tests: false
    timeout-minutes: 120
    needs: [ changes, test ]
    if: >-
      needs.changes.outputs.source_changes == 'true' &&
      needs.changes.outputs.maintenance_module_only_changes != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: ${{ matrix.java-version }}

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Run core ${{ matrix.lane }} lane
        run: |
          ./gradlew :core:${{ matrix.task }} \
            -PskipWeb=true \
            -PskipITs \
            -PskipDockerTests=${{ matrix.skip-docker-tests }}

      - name: Validate core test evidence
        run: |
          junit_xml="$(find "core/build/test-results/${{ matrix.task }}" \
            -type f -name 'TEST-*.xml' -print -quit)"
          test -n "${junit_xml}"
          test -s "${junit_xml}"
          test -s "build/reports/tests/core/${{ matrix.task }}/index.html"
          test -s "core/build/jacoco/${{ matrix.task }}.exec"

      - name: Upload core test evidence
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.lane }}-test-evidence
          path: |
            core/build/test-results/${{ matrix.task }}
            build/reports/tests/core/${{ matrix.task }}
            core/build/jacoco/${{ matrix.task }}.exec
          if-no-files-found: error
          retention-days: 1

      - name: Upload core test report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: core test report ${{ matrix.lane }}
          path: |
            build/reports/tests/core
            core/build/test-results

  # Integration tests: each area runs when its paths change, after the unit test stages pass.
  access-control-it:
    needs: [ changes, test, medium-test, core-test ]
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs['medium-test'].result) &&
      contains(fromJSON('["success", "skipped"]'), needs['core-test'].result) &&
      needs.changes.outputs.access_control_it == 'true'
    strategy:
      matrix:
        architecture: [ linux/amd64 ]
        java-version: [ 17 ]
    uses: ./.github/workflows/access-control-integration-test-action.yml
    with:
      architecture: ${{ matrix.architecture }}
      java-version: ${{ matrix.java-version }}

  backend-it:
    needs: [ changes, test, medium-test, core-test ]
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs['medium-test'].result) &&
      contains(fromJSON('["success", "skipped"]'), needs['core-test'].result) &&
      needs.changes.outputs.backend_it == 'true'
    strategy:
      matrix:
        architecture: [ linux/amd64 ]
        java-version: [ 17 ]
        backend: [ h2, mysql, postgresql ]
        test-mode: [ embedded, deploy ]
        exclude:
          - test-mode: 'embedded'
            backend: 'mysql'
          - test-mode: 'embedded'
            backend: 'postgresql'
          - test-mode: 'deploy'
            backend: 'h2'
    uses: ./.github/workflows/backend-integration-test-action.yml
    with:
      architecture: ${{ matrix.architecture }}
      java-version: ${{ matrix.java-version }}
      backend: ${{ matrix.backend }}
      test-mode: ${{ matrix.test-mode }}

  flink-it:
    needs: [ changes, test, medium-test, core-test ]
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs['medium-test'].result) &&
      contains(fromJSON('["success", "skipped"]'), needs['core-test'].result) &&
      needs.changes.outputs.flink_it == 'true'
    strategy:
      matrix:
        architecture: [ linux/amd64 ]
        java-version: [ 17 ]
    uses: ./.github/workflows/flink-integration-test-action.yml
