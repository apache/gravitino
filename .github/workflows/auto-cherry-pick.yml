name: Automatically cherry-pick merged PR to different branches

on:
  workflow_run:
    workflows: [Fork CI PR Signal]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: 'Merged main PR to backport or retry using its current release labels'
        required: true
        type: string

permissions: {}

concurrency:
  group: backport-${{ github.event.workflow_run.head_sha || inputs.pull-request }}
  cancel-in-progress: false

jobs:
  resolve:
    permissions:
      contents: read
      pull-requests: read
    if: >-
      github.repository == 'apache/gravitino' &&
      (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-slim
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
      task: ${{ steps.resolve.outputs.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The privileged coordinator never checks out PR or release-branch code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: resolve
        uses: actions/github-script@v7
        env:
          BACKPORT_BOT_OWNER: ${{ vars.BACKPORT_BOT_OWNER }}
        with:
          script: |
            await require('./.github/scripts/backport-to-fork.cjs').resolve({ github, context, core, botOwner: process.env.BACKPORT_BOT_OWNER });

  backport:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    needs: resolve
    if: needs.resolve.outputs.targets != '[]' && fromJSON(needs.resolve.outputs.task).owner != 'apache'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    uses: ./.github/workflows/cherry-pick-branch.yml
    with:
      target-branch: ${{ matrix.target }}
      task: ${{ needs.resolve.outputs.task }}
    secrets: inherit

  backport-upstream:
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write
    needs: resolve
    if: needs.resolve.outputs.targets != '[]' && fromJSON(needs.resolve.outputs.task).owner == 'apache'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    uses: ./.github/workflows/cherry-pick-branch.yml
    with:
      target-branch: ${{ matrix.target }}
      task: ${{ needs.resolve.outputs.task }}
    secrets: inherit
