name: Automatically cherry-pick merged PR to different branches

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: 'Merged main PR to backport or retry using its current release labels'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: backport-${{ github.event.pull_request.number || inputs.pull-request }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.repository == 'apache/gravitino' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: ubuntu-slim
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
      task: ${{ steps.resolve.outputs.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The privileged coordinator never checks out PR or release-branch code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/backport-to-fork.cjs').resolve({ github, context, core });

  backport:
    needs: resolve
    if: needs.resolve.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    uses: ./.github/workflows/cherry-pick-branch.yml
    with:
      target-branch: ${{ matrix.target }}
      task: ${{ needs.resolve.outputs.task }}
    secrets: inherit
