name: mcp-integration-test

on:
  workflow_call:
    inputs:
      base-ref:
        type: string
        required: false
        default: ''
      base-sha:
        type: string
        required: false
        default: ''
      head-repository:
        type: string
        required: false
        default: ''
      head-sha:
        type: string
        required: false
        default: ''
      sync:
        type: string
        required: false
        default: ''

concurrency:
  group: fork-ci-mcp-${{ inputs.head-sha || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mcp_or_authz_changes: ${{ steps.filter.outputs.mcp_or_authz_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/checkout-and-sync
        with:
          base-ref: ${{ inputs.base-ref }}
          base-sha: ${{ inputs.base-sha }}
          head-repository: ${{ inputs.head-repository }}
          head-sha: ${{ inputs.head-sha }}
          sync: ${{ inputs.sync }}
        id: checkout
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ steps.checkout.outputs.synced == 'true' && steps.checkout.outputs.base-sha || steps.checkout.outputs.base-ref }}
          ref: ${{ steps.checkout.outputs.synced == 'true' && steps.checkout.outputs.head-sha || github.ref }}
          filters: |
            mcp_or_authz_changes:
              - 'mcp-server/**'
              - 'server/**'
              - 'core/src/main/java/org/apache/gravitino/authorization/**'
              - 'server-common/src/main/java/org/apache/gravitino/server/authentication/**'
              - '.github/workflows/mcp-integration-test.yml'
              - '.github/workflows/mcp-integration-test-action.yml'

  mcp-authz-integration-test:
    needs: changes
    if: needs.changes.outputs.mcp_or_authz_changes == 'true'
    uses: ./.github/workflows/mcp-integration-test-action.yml
    with:
      base-ref: ${{ inputs.base-ref }}
      base-sha: ${{ inputs.base-sha }}
      head-repository: ${{ inputs.head-repository }}
      head-sha: ${{ inputs.head-sha }}
      sync: ${{ inputs.sync }}
      java-version: '17'
