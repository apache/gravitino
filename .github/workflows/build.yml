name: build

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main", "branch-*" ]
    paths-ignore:
      - 'docs/assets/**'
      - 'web-v2/**'
  pull_request:
    branches: [ "main", "branch-*" ]
    paths-ignore:
      - 'docs/assets/**'
      - 'web-v2/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test source license-reference checker
        run: bash dev/release/test-check-license.sh
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          list-files: shell
          filters: |
            source_changes:
              - '.github/**'
              - 'catalogs/**'
              - 'catalogs-contrib/**'
              - 'clients/**'
              - 'conf/**'
              - 'dev/**'
              - 'docs/open-api/**'
              - 'gradle/**'
              - 'gradle.properties'
              - 'meta/**'
              - 'scripts/**'
              - 'web/**'
              - '**/*.java'
              - '**/*.kts'
              - '**/*.py'
              - '**/*.rs'
              - '**/resources/**'
              - '**/src/**'
              - '**/*.md'
              - '**/*.mdx'
              - '!docs/**/*.png'
              - '!docs/**/*.svg'
              - '!docs/**/*.jpg'
              - '!docs/**/*.jpeg'
              - '!docs/**/*.gif'
              - '!docs/**/*.webp'
              - 'mcp-server/**'
            spark_connector_changes:
              - spark-connector/**
            mcp_server_changes:
              - mcp-server/**
      - name: Determine maintenance-module-only changes
        id: maintenance_module_only
        env:
          SOURCE_CHANGE_FILES: ${{ steps.filter.outputs.source_changes_files }}
        run: |
          # Route to the maintenance-only build path only when every source
          # change in the PR is under maintenance/. Non-source changes are
          # already filtered out by source_changes_files.
          source_files=()
          if [ -n "${SOURCE_CHANGE_FILES}" ]; then
            eval "source_files=(${SOURCE_CHANGE_FILES})"
          fi

          maintenance_module_only=false
          if [ "${#source_files[@]}" -gt 0 ]; then
            maintenance_module_only=true
            for path in "${source_files[@]}"; do
              case "$path" in
                maintenance/*) ;;
                *)
                  maintenance_module_only=false
                  break
                  ;;
              esac
            done
          fi

          echo "maintenance_module_only_changes=${maintenance_module_only}" >> "${GITHUB_OUTPUT}"
    outputs:
      source_changes: ${{ steps.filter.outputs.source_changes }}
      spark_connector_changes: ${{ steps.filter.outputs.spark_connector_changes }}
      mcp_server_changes: ${{ steps.filter.outputs.mcp_server_changes }}
      maintenance_module_only_changes: ${{ steps.maintenance_module_only.outputs.maintenance_module_only_changes }}

  compile-check:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.source_changes != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: 17

      - name: Build with Gradle
        run: |
          ./gradlew assemble -PskipWeb=true

  # To check the spark-connector is compatible with scala2.13
  spark-connector-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.spark_connector_changes == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'gradle'

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Build with Scala2.13
        run: |
          ./gradlew :spark-connector:spark-3.5:build -PscalaVersion=2.13 -PskipITs -PskipDockerTests=false -PskipWeb=true

      - name: Upload unit tests report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit test report
          path: |
            build/reports
            spark-connector/**/*.log

  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ 17 ]
    timeout-minutes: 120
    needs: changes
    if: needs.changes.outputs.source_changes == 'true'
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: ${{ matrix.java-version }}

      - name: Test publish to local
        run: ./gradlew publishToMavenLocal -PskipWeb=true -x test

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Install dependencies
        run: |
          # libssl1.1 is not in the runner's apt sources, so the .deb is fetched directly.
          deb=libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          for host in archive.ubuntu.com nz2.archive.ubuntu.com security.ubuntu.com; do
            wget --tries=3 --timeout=30 -O "$deb" "https://$host/ubuntu/pool/main/o/openssl/$deb" && break
            rm -f "$deb"
          done
          [ -s "$deb" ] || { echo "Could not download $deb from any mirror" >&2; exit 1; }
          sudo dpkg -i "$deb"

      - name: Build with Gradle
        run: |
          if [ "${{ needs.changes.outputs.maintenance_module_only_changes }}" = "true" ]; then
            ./gradlew \
              :maintenance:optimizer-api:build \
              :maintenance:updaters:build \
              :maintenance:optimizer:build \
              :maintenance:jobs:build \
              -PskipWeb=true \
              -PskipITs \
              -PskipDockerTests=false
            exit 0
          fi

          gradle_args=(
            build
            --max-workers=2
            -PskipWeb=true
            -PskipITs
            -PskipDockerTests=false
            -x :clients:client-python:build
            -x :catalogs-contrib:catalog-jdbc-clickhouse:test
            -x :catalogs-contrib:catalog-jdbc-hologres:test
            -x :catalogs-contrib:catalog-jdbc-oceanbase:test
            # Core's tests run in the core-test job, one lane per job; :core:test is deprecated.
            -x :core:test
          )

          if [ "${{ needs.changes.outputs.mcp_server_changes }}" != "true" ]; then
            gradle_args+=(
              -x :mcp-server:build
              -x :mcp-server:test
              -x :mcp-server:pylint
              -x :web-v2:web:build
            )
          fi

          printf './gradlew'
          printf ' %q' "${gradle_args[@]}"
          printf '\n'

          ./gradlew "${gradle_args[@]}"

      - name: Upload coverage data
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-build
          # build.gradle.kts anchors the artifact at the repository root, so the report paths keep
          # their module prefix, which jacoco_report.py uses to name modules.
          path: |
            build.gradle.kts
            **/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload unit tests report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: unit test report
          path: |
            build/reports
            catalogs-contrib/**/*.log
            catalogs-contrib/**/*.tar
            catalogs/**/*.log
            catalogs/**/*.tar

  core-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 17 ]
        # One job per core test lane, so each lane's results and coverage inputs are inspectable on
        # their own. Lanes are defined in core/build.gradle.kts.
        lane: [ unit, h2, mysql, postgresql ]
        include:
          - lane: unit
            task: coreUnitTest
            skip-docker-tests: true
          - lane: h2
            task: coreH2Test
            skip-docker-tests: true
          - lane: mysql
            task: coreMySQLTest
            skip-docker-tests: false
          - lane: postgresql
            task: corePostgreSQLTest
            skip-docker-tests: false
    timeout-minutes: 120
    needs: changes
    if: >-
      needs.changes.outputs.source_changes == 'true' &&
      needs.changes.outputs.maintenance_module_only_changes != 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        with:
          java-version: ${{ matrix.java-version }}

      - name: Free up disk space
        run: |
          dev/ci/util_free_space.sh

      - name: Run core ${{ matrix.lane }} lane
        run: |
          ./gradlew :core:${{ matrix.task }} \
            -PskipWeb=true \
            -PskipITs \
            -PskipDockerTests=${{ matrix.skip-docker-tests }}

      - name: Validate core test evidence
        run: |
          junit_xml="$(find "core/build/test-results/${{ matrix.task }}" \
            -type f -name 'TEST-*.xml' -print -quit)"
          test -n "${junit_xml}"
          test -s "${junit_xml}"
          test -s "build/reports/tests/core/${{ matrix.task }}/index.html"
          test -s "core/build/jacoco/${{ matrix.task }}.exec"

      - name: Upload core test evidence
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.lane }}-test-evidence
          path: |
            core/build/test-results/${{ matrix.task }}
            build/reports/tests/core/${{ matrix.task }}
            core/build/jacoco/${{ matrix.task }}.exec
          if-no-files-found: error
          retention-days: 1

      - name: Upload core test report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: core test report ${{ matrix.lane }}
          path: |
            build/reports/tests/core
            core/build/test-results

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ changes, build, core-test ]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.build.result == 'success' &&
      (needs.changes.outputs.maintenance_module_only_changes == 'true' ||
      needs['core-test'].result == 'success')
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-java-toolchains
        if: needs.changes.outputs.maintenance_module_only_changes != 'true'
        with:
          java-version: 17

      - name: Fetch base branch for coverage diff
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          merge-multiple: true

      - name: Download core test evidence
        if: needs.changes.outputs.maintenance_module_only_changes != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: core-*-test-evidence
          path: core-test-evidence

      - name: Generate combined core coverage
        if: needs.changes.outputs.maintenance_module_only_changes != 'true'
        run: |
          mkdir -p core/build/jacoco
          for task in coreUnitTest coreH2Test coreMySQLTest corePostgreSQLTest; do
            exec_file="$(find core-test-evidence -path "*/core/build/jacoco/${task}.exec" -print -quit)"
            test -n "${exec_file}"
            install -m 0644 "${exec_file}" "core/build/jacoco/${task}.exec"
          done
          ./gradlew \
            :core:jacocoTestReport \
            -PcoreSuiteCoverage=true \
            -PskipWeb=true
          test -s core/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Generate Coverage Report
        id: coverage
        run: |
          python3 dev/ci/jacoco_report.py \
            --base-ref "${{ github.base_ref }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --repo-url "${{ github.event.pull_request.head.repo.html_url }}" \
            --min-overall 40 \
            --min-changed 60 \
            --output coverage-report.md

      - name: Save PR number
        if: steps.coverage.outputs.has_reports == 'true'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload Coverage Report
        if: steps.coverage.outputs.has_reports == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage-report.md
            pr-number.txt

      - name: Output Coverage Info
        if: steps.coverage.outputs.has_reports == 'true'
        run: |
          echo "Total coverage ${{ steps.coverage.outputs.coverage-overall }}"
          echo "Changed Files coverage ${{ steps.coverage.outputs.coverage-changed-files }}"
