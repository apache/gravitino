name: Daft Iceberg REST Contract Test Action

on:
  workflow_call:

permissions:
  contents: read

jobs:
  DaftIcebergIT:
    name: Daft Iceberg REST contract (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Package Gravitino
        run: ./gradlew compileDistribution -PskipWeb=true -x test

      - name: Run Daft Iceberg REST contract test
        run: |
          set -o pipefail
          mkdir -p clients/client-python/build/daft-iceberg-it-logs
          ./gradlew -PpythonVersion=3.12 -PskipDockerTests=true -PskipWeb=true \
            :clients:client-python:daftIcebergIT 2>&1 | \
            tee clients/client-python/build/daft-iceberg-it-logs/test.log

      - name: Upload Daft Iceberg IT logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: daft-iceberg-it-logs
          if-no-files-found: ignore
          path: |
            clients/client-python/build/daft-iceberg-it-logs
            distribution/package/logs
