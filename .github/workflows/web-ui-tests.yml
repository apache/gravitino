name: Web UI Tests

on:
  workflow_call:
    inputs:
      required_ci:
        description: Run this suite as part of the Required CI orchestrator.
        required: false
        type: boolean
        default: false
  push:
    branches: [ "main", "branch-*" ]
    paths:
      - 'web/web/**'
      - '.github/workflows/web-ui-tests.yml'

concurrency:
  group: ${{ github.event_name == 'workflow_call' && inputs.required_ci && 'required-web-ui' || github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            source_changes:
              - 'web/web/**'
              - '.github/workflows/web-ui-tests.yml'
    outputs:
      source_changes: ${{ steps.filter.outputs.source_changes }}

  test:
    needs: changes
    if: needs.changes.outputs.source_changes == 'true'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
    
    - name: Setup Node.js 20.19.0
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'pnpm'
        cache-dependency-path: 'web/web/pnpm-lock.yaml'
    
    - name: Install dependencies
      working-directory: web/web
      run: pnpm install --frozen-lockfile
    
    - name: Run linting
      working-directory: web/web
      run: pnpm lint
    
    - name: Run prettier check
      working-directory: web/web
      run: pnpm prettier:check
    
    - name: Run tests
      working-directory: web/web
      run: pnpm test:coverage

    - name: Build application
      working-directory: web/web
      run: pnpm build
