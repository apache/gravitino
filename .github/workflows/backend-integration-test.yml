name: Backend Integration Test

# Controls when the workflow will run
on:
  push:
    branches: [ "main", "branch-*" ]
  pull_request:
    branches: [ "main", "branch-*" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disable Git automatic maintenance
        run: git config --local maintenance.auto false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        id: filter
        with:
          filters: |
            source_changes:
              - .github/**
              - api/**
              - bin/**
              - catalogs/**
              - clients/client-java/**
              - clients/client-java-runtime/**
              - clients/filesystem-hadoop3/**
              - clients/cli/**
              - common/**
              - conf/**
              - core/**
              - lance/**
              - dev/**
              - gradle/**
              - iceberg/**
              - integration-test-common/**
              - meta/**
              - scripts/**
              - server/**
              - bundles/**
              - server-common/**
              - build.gradle.kts
              - gradle.properties
              - gradlew
              - settings.gradle.kts
      - name: List backend integration test shards
        id: shards
        run: echo "backend_it_shards=$(dev/ci/test-shards.sh backend-it --list)" >> "${GITHUB_OUTPUT}"
    outputs:
      source_changes: ${{ steps.filter.outputs.source_changes }}
      backend_it_shards: ${{ steps.shards.outputs.backend_it_shards }}

  BackendIT:
    needs: changes
    if: needs.changes.outputs.source_changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        architecture: [ linux/amd64 ]
        java-version: [ 17 ]
        backend: [ h2, mysql, postgresql ]
        test-mode: [ embedded, deploy ]
        # Shards are defined in dev/ci/test-shards.sh.
        shard: ${{ fromJSON(needs.changes.outputs.backend_it_shards) }}
        exclude:
          - test-mode: 'embedded'
            backend: 'mysql'
          - test-mode: 'embedded'
            backend: 'postgresql'
          - test-mode: 'deploy'
            backend: 'h2'
    uses: ./.github/workflows/backend-integration-test-action.yml
    with:
      architecture: ${{ matrix.architecture }}
      java-version: ${{ matrix.java-version }}
      backend: ${{ matrix.backend }}
      test-mode: ${{ matrix.test-mode }}
      shard: ${{ matrix.shard }}
