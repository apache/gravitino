name: Update Fork CI Status
on:
  workflow_run:
    workflows: [Fork CI PR Signal, Fork CI]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pull-request:
        description: 'Optional PR number to force-refresh, including settled checks'
        required: false
        type: string
permissions: {}
# A group keeps only one pending run, so each PR signal gets its own group: a burst of
# signals must not cancel each other. Sweeps share one group.
concurrency:
  group: >-
    fork-ci-status-update-${{ github.event.workflow_run.name == 'Fork CI PR Signal' &&
    github.event.workflow_run.head_sha || 'sweep' }}
  cancel-in-progress: false
jobs:
  update:
    if: >-
      github.repository == 'apache/gravitino' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-slim
    # Scheduled sweeps poll for 11 minutes; ubuntu-slim stops jobs after 15.
    timeout-minutes: 14
    permissions:
      actions: read
      checks: write
      statuses: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            await require('./.github/scripts/update-fork-ci.cjs').update({ github, context, core });
