name: Update Fork CI Status

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  pull-requests: read

concurrency:
  group: fork-ci-status-update
  cancel-in-progress: false

jobs:
  update:
    name: Update fork CI checks
    if: github.repository == 'apache/gravitino'
    runs-on: ubuntu-slim
    steps:
      # The state of the previous sweep lets this sweep skip pull requests that have a
      # final result and no new activity, without spending API calls on them.
      - name: Restore previous sweep state
        uses: actions/cache/restore@v4
        with:
          path: .fork-ci-status
          key: fork-ci-status-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fork-ci-status-

      - name: Synchronize fork CI checks
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const fs = require('fs');
            const stateFile = '.fork-ci-status/state.json';
            const HOUR = 60 * 60 * 1000;
            // A pull request with activity in this window is always checked, which covers
            // the time between a push and the check created by the Fork CI Status workflow.
            const RECENT_ACTIVITY = HOUR;
            // How long a completed check is still watched for a re-run of the fork workflow.
            // action_required is also set when the fork run had not started when the check was created.
            const WATCH = { action_required: 24 * HOUR, default: 7 * 24 * HOUR };
            const FINAL = ['success', 'neutral', 'skipped'];

            const rateLimit = async () => (await github.rest.rateLimit.get()).data.resources.core;
            const budgetBefore = await rateLimit();
            let calls = 0;
            github.hook.before('request', () => { calls++; });

            let previous = {};
            try {
              previous = JSON.parse(fs.readFileSync(stateFile, 'utf8'));
            } catch (error) {
              core.info('No previous sweep state; checking every pull request.');
            }
            const next = {};
            const now = Date.now();

            const skippable = (pr, state) => {
              if (!state || state.sha !== pr.head.sha || state.updated_at !== pr.updated_at) return false;
              if (now - Date.parse(pr.updated_at) < RECENT_ACTIVITY) return false;
              if (state.kind === 'none' || state.kind === 'final') return true;
              if (state.kind === 'watch') {
                const window = WATCH[state.conclusion] || WATCH.default;
                return now - Date.parse(state.completed_at) > window;
              }
              return false;
            };

            const syncPr = async pr => {
              const state = { sha: pr.head.sha, updated_at: pr.updated_at, kind: 'none' };
              next[pr.number] = state;
              if (!pr.head.repo) return 'none';
              const owner = pr.head.repo.owner.login;
              const repo = pr.head.repo.name;

              const { data: { check_runs: checks } } = await github.rest.checks.listForRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: pr.head.sha,
                check_name: 'Fork CI', filter: 'all', per_page: 100 });
              const latest = checks.sort((a, b) => b.id - a.id)[0];
              // The Fork CI Status workflow creates the first check for each head commit.
              // Only recently active pull requests without one are looked up, to recover
              // from a failed notification.
              if (!latest && now - Date.parse(pr.updated_at) >= RECENT_ACTIVITY) return 'none';

              let run;
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner, repo, workflow_id: 'fork-ci.yml', head_sha: pr.head.sha, per_page: 10 });
                run = data.workflow_runs.sort((a, b) => b.id - a.id)[0];
              } catch (error) {
                core.warning(`Unable to read ${owner}/${repo}: ${error.message}`);
                if (!latest) return 'none';
              }
              if (!latest && !run) return 'none';

              const detailsUrl = run
                ? `https://github.com/${owner}/${repo}/actions/runs/${run.id}`
                : `https://github.com/${owner}/${repo}/actions/workflows/fork-ci.yml`;
              const status = !run || run.status === 'completed' ? 'completed' :
                (run.status === 'in_progress' ? 'in_progress' : 'queued');
              const conclusion = !run ? 'action_required' :
                (status === 'completed' ? run.conclusion : null);
              const output = run
                ? {
                    title: 'Fork CI results',
                    summary: `[See fork CI results](${detailsUrl})`,
                    text: JSON.stringify({ owner, repo, run_id: run.id, run_attempt: run.run_attempt })
                  }
                : {
                    title: 'Fork CI is not available',
                    summary: 'Enable GitHub Actions in the fork and push the PR branch again.',
                    text: JSON.stringify({ owner, repo, workflow: 'fork-ci.yml' })
                  };

              let recorded = {};
              try {
                recorded = JSON.parse((latest && latest.output && latest.output.text) || '{}');
              } catch (error) {
                recorded = {};
              }
              const sameRun = !run ? recorded.run_id === undefined :
                recorded.run_id === run.id && recorded.run_attempt === run.run_attempt;
              const params = {
                owner: context.repo.owner, repo: context.repo.repo,
                status, ...(conclusion ? { conclusion } : {}),
                details_url: detailsUrl, output
              };
              let action = 'unchanged';
              if (!latest) {
                await github.rest.checks.create({ ...params, name: 'Fork CI', head_sha: pr.head.sha });
                action = 'created';
              } else if (latest.status === 'completed' && !sameRun) {
                // A completed check run cannot go back to in progress, so a re-run of the
                // fork workflow gets a new check run; the pull request shows the newest one.
                await github.rest.checks.create({ ...params, name: 'Fork CI', head_sha: pr.head.sha });
                action = 'created';
              } else if (latest.status !== status || (latest.conclusion || null) !== conclusion || !sameRun) {
                await github.rest.checks.update({ ...params, check_run_id: latest.id });
                action = 'updated';
              }

              if (status !== 'completed') {
                state.kind = 'active';
              } else if (FINAL.includes(conclusion)) {
                state.kind = 'final';
              } else {
                state.kind = 'watch';
                state.conclusion = conclusion;
                state.completed_at = action === 'unchanged' && latest.completed_at
                  ? latest.completed_at : new Date().toISOString();
              }
              return action;
            };

            const prs = await github.paginate(
              'GET /repos/{owner}/{repo}/pulls',
              { owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });

            // Keep one pull request's failure from stopping the rest of the sweep.
            const failed = [];
            const counts = {};
            for (const pr of prs) {
              let result;
              if (skippable(pr, previous[pr.number])) {
                next[pr.number] = previous[pr.number];
                result = 'skipped';
              } else {
                try {
                  result = await syncPr(pr);
                } catch (error) {
                  // Drop the state so the next sweep checks this pull request again.
                  delete next[pr.number];
                  failed.push(pr.number);
                  result = 'failed';
                  core.warning(`Unable to update Fork CI for #${pr.number}: ${error.message}`);
                }
              }
              counts[result] = (counts[result] || 0) + 1;
            }

            fs.mkdirSync('.fork-ci-status', { recursive: true });
            fs.writeFileSync(stateFile, JSON.stringify(next));
            core.info(`Pull requests: ${prs.length} ${JSON.stringify(counts)}; API calls: ${calls}`);
            const budgetAfter = await rateLimit();
            core.info(`GITHUB_TOKEN core rate limit: ${budgetAfter.used}/${budgetAfter.limit} used ` +
              `(${budgetBefore.used} before this sweep), resets at ${new Date(budgetAfter.reset * 1000).toISOString()}`);
            if (failed.length) {
              core.setFailed(`Fork CI checks were not updated for: ${failed.map(n => `#${n}`).join(', ')}`);
            }

      - name: Save sweep state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .fork-ci-status
          key: fork-ci-status-${{ github.run_id }}-${{ github.run_attempt }}
