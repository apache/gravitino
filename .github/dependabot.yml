version: 2
updates:
  # The shared RustFS fixture consumes this Compose image pin directly.
  - package-ecosystem: "docker-compose"
    directory: "/integration-test-common/src/test/resources"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "rustfs/rustfs"
    open-pull-requests-limit: 2

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Java (Gradle) : Single root entry is enough because settings.gradle.kts includes all submodules
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"

  # NPM
  - package-ecosystem: "npm"
    directory: "/web/web"
    schedule:
      interval: "monthly"

  # PYTHON
  - package-ecosystem: "pip"
    directory: "/mcp-server"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directory: "/clients/client-python"
    schedule:
      interval: "monthly"
