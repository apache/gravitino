version: 2
updates:
  # Container manifests, including new Compose fixtures when they are added.
  - package-ecosystem: "docker"
    directories:
      - "/dev/docker/*"
      - "/dev/charts/*"
      - "/dev/charts/*/templates/tests"
    exclude-paths:
      - "**/*compose*.yml"
      - "**/*compose*.yaml"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker-compose"
    directories:
      - "**/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Java (Gradle) : Single root entry is enough because settings.gradle.kts includes all submodules
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"

  # NPM
  - package-ecosystem: "npm"
    directory: "/web/web"
    schedule:
      interval: "monthly"

  # PYTHON
  - package-ecosystem: "pip"
    directory: "/mcp-server"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directory: "/clients/client-python"
    schedule:
      interval: "monthly"
