name: 'Setup Java Toolchains'
description: 'Install a primary JDK and JDK 24 (for Trino); Gradle finds JDK 24 through fromEnv in gradle.properties'

inputs:
  java-version:
    description: 'Primary Java version'
    default: '17'
  cache:
    description: 'Gradle cache setting'
    default: 'gradle'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        java-version: 24
        distribution: temurin

    - uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin
        cache: ${{ inputs.cache }}
