; r.sub is the immutable set of role-id strings captured by this request.
; p.sub is one role-id string. No shared user/group membership is consulted.
[request_definition]
r = sub, metadataType, metadataId, act

[policy_definition]
p = sub, metadataType, metadataId, act, eft

[policy_effect]
e = some(where (p.eft == allow)) && !some(where (p.eft == deny))

[matchers]
m = hasRole(r.sub, p.sub) && r.metadataId == p.metadataId && r.metadataType == p.metadataType && ( (p.act == "OWNER" && r.act == "OWNER") || r.act == p.act )
