---

paths:
  "/metalakes/{metalake}/terms":
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/metalake
    get:
      operationId: listTerms
      tags:
        - glossary
      summary: List glossary terms
      description: Lists terms visible to the caller. Domain and status filters also
        apply to detailed results.
      parameters:
        - in: query
          name: details
          description: Return term definitions and visible relations.
          schema:
            type: boolean
            default: false
        - in: query
          name: domain
          description: Include terms in the domain and its visible subdomains. Must be non-blank when supplied.
          schema:
            type: string
            minLength: 1
        - in: query
          name: nameContains
          description: Case-insensitive substring of the term name. Must be non-blank when supplied.
          schema:
            type: string
            minLength: 1
        - in: query
          name: status
          description: Include only terms and nested relation endpoints with this status.
          schema:
            $ref: "#/components/schemas/TermStatusInput"
      responses:
        "200":
          description: Successful glossary operation.
          content:
            application/vnd.gravitino.v1+json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TermNamesResponse"
                  - $ref: "#/components/schemas/TermListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MetalakeNotInUse"
        5XX:
          $ref: ./openapi.yaml#/components/responses/ServerErrorResponse
    post:
      operationId: createTerm
      tags:
        - glossary
      summary: Create a glossary term
      description: Creates the definition, memberships and relations atomically.
        Status defaults to APPROVED. With authorization enabled, the registered caller
        becomes the owner and needs effective VIEW_DEFINITION and CREATE_DEFINITION
        plus read access to each requested domain and referenced term.
        With authorization disabled, creation leaves the owner unset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermCreateRequest"
      responses:
        "200":
          description: Successful glossary operation.
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/TermResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        5XX:
          $ref: ./openapi.yaml#/components/responses/ServerErrorResponse
  "/metalakes/{metalake}/terms/{term}":
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/metalake
      - name: term
        in: path
        required: true
        description: Term name. Encode a slash in the name as %2F.
        schema:
          type: string
    get:
      operationId: getTerm
      tags:
        - glossary
      summary: Get a glossary term
      description: Returns the definition and its visible direct broader, narrower and
        related terms.
      parameters:
        - in: query
          name: status
          description: Apply this status to roots and nested terms. A named root excluded
            by the filter returns 404.
          schema:
            $ref: "#/components/schemas/TermStatusInput"
      responses:
        "200":
          description: Successful glossary operation.
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/TermResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MetalakeNotInUse"
        5XX:
          $ref: ./openapi.yaml#/components/responses/ServerErrorResponse
    put:
      operationId: alterTerm
      tags:
        - glossary
      summary: Alter a glossary term
      description: Applies all edits in order in one transaction. A matching no-op
        preserves the revision. A stale expectedRevision returns 409. Clearing a
        definition or source reference requires an explicit null. With authorization enabled,
        editing requires effective VIEW_DEFINITION and either MANAGE_DEFINITIONS or
        current ownership with CREATE_DEFINITION. Referenced terms and domains must be readable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermUpdatesRequest"
      responses:
        "200":
          description: Successful glossary operation.
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/TermResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        5XX:
          $ref: ./openapi.yaml#/components/responses/ServerErrorResponse
    delete:
      operationId: dropTerm
      tags:
        - glossary
      summary: Drop a glossary term
      description: Returns dropped=false for an absent or hidden term. With authorization enabled,
        deleting a visible term requires effective VIEW_DEFINITION and MANAGE_DEFINITIONS.
      responses:
        "200":
          $ref: ./openapi.yaml#/components/responses/DropResponse
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The metalake does not exist. An absent or hidden term returns HTTP 200 with dropped=false.
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorModel
        "409":
          $ref: "#/components/responses/Conflict"
        5XX:
          $ref: ./openapi.yaml#/components/responses/ServerErrorResponse
  "/metalakes/{metalake}/terms/{term}/hierarchy":
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/metalake
      - name: term
        in: path
        required: true
        description: Term name. Encode a slash in the name as %2F.
        schema:
          type: string
    get:
      operationId: getTermHierarchy
      tags:
        - glossary
      summary: Get the glossary term hierarchy
      description: Returns each reachable term once, excluding the root. Traversal
        stops at hidden or filtered nodes.
      parameters:
        - in: query
          name: direction
          description: Case-insensitive traversal direction (BROADER for ancestors, NARROWER for descendants).
          schema:
            type: string
            pattern: "^([Bb][Rr][Oo][Aa][Dd][Ee][Rr]|[Nn][Aa][Rr][Rr][Oo][Ww][Ee][Rr])$"
            default: NARROWER
        - in: query
          name: status
          description: Apply this status to roots and nested terms. A named root excluded
            by the filter returns 404.
          schema:
            $ref: "#/components/schemas/TermStatusInput"
      responses:
        "200":
          description: Successful glossary operation.
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/TermTreeResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/MetalakeNotInUse"
        5XX:
          $ref: ./openapi.yaml#/components/responses/ServerErrorResponse
  "/metalakes/{metalake}/terms/{term}/objects":
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/metalake
      - in: path
        name: term
        required: true
        description: Glossary term name.
        schema:
          type: string
    get:
      operationId: listTermBindings
      tags: [glossary]
      summary: List a bounded page of visible glossary bindings
      parameters:
        - in: query
          name: kind
          description: Restrict the binding kind (case-insensitive).
          schema:
            type: string
            pattern: "^([Ii][Mm][Pp][Ll][Ee][Mm][Ee][Nn][Tt][Ee][Dd]_[Bb][Yy]|[Uu][Ss][Ee][Dd]_[Bb][Yy])$"
            example: IMPLEMENTED_BY
        - in: query
          name: types
          description: Filter by metadata object types. Use SEMANTIC_MODEL for metrics.
          schema:
            type: array
            items:
              type: string
        - in: query
          name: pageSize
          description: Maximum visible bindings to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - in: query
          name: pageToken
          description: >-
            Continue with the same filters even after an empty page. Each request examines at
            most 1,000 candidates. Changed filters or an invalid token return 400. A changed
            visible term identity or revision returns 409. Restart without pageToken after a
            conflict or after the server's token key changes.
          schema:
            type: string
        - in: query
          name: status
          description: Restrict term visibility to this status.
          schema:
            $ref: "#/components/schemas/TermStatusInput"
      responses:
        "200":
          description: Successful glossary binding operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermBindingListResponse"
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/TermBindingListResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: ./openapi.yaml#/components/responses/NotAcceptableErrorResponse
        "409":
          $ref: "#/components/responses/Conflict"
        5XX:
          $ref: "#/components/responses/BindingServerError"
  "/metalakes/{metalake}/objects/{type}/{fullName}/terms":
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/metalake
      - in: path
        name: type
        required: true
        description: >-
          Accepts CATALOG, SCHEMA, TABLE, VIEW, COLUMN, FILESET, TOPIC and MODEL, ignoring case.
          GET also accepts SEMANTIC_MODEL. A semantic model has no direct terms; use children=true
          to read its metrics or the named metric endpoint to change their bindings.
        schema:
          type: string
      - in: path
        name: fullName
        required: true
        description: Fully qualified metadata object name.
        schema:
          type: string
    get:
      operationId: listObjectTerms
      tags: [glossary]
      summary: List visible glossary terms of a metadata object
      parameters:
        - in: query
          name: details
          description: Return term definitions in place of names.
          schema:
            type: boolean
            default: false
        - in: query
          name: children
          description: Include matching columns or metrics and return details. Supported on tables and semantic models.
          schema:
            type: boolean
            default: false
        - in: query
          name: status
          description: Restrict term visibility to this status.
          schema:
            $ref: "#/components/schemas/TermStatusInput"
      responses:
        "200":
          description: Successful glossary binding operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectTermsReadResponse"
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/ObjectTermsReadResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: ./openapi.yaml#/components/responses/NotAcceptableErrorResponse
        "409":
          $ref: "#/components/responses/Conflict"
        5XX:
          $ref: "#/components/responses/BindingServerError"
    post:
      operationId: associateObjectTerms
      tags: [glossary]
      summary: Update the glossary terms of a metadata object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermsAssociateRequest"
      responses:
        "200":
          description: Successful glossary binding operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermNamesResponse"
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/TermNamesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: ./openapi.yaml#/components/responses/NotAcceptableErrorResponse
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        5XX:
          $ref: "#/components/responses/BindingServerError"
  "/metalakes/{metalake}/objects/semantic_model/{fullName}/metrics/{metric}/terms":
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/metalake
      - in: path
        name: fullName
        required: true
        description: Fully qualified metadata object name.
        schema:
          type: string
      - in: path
        name: metric
        required: true
        description: Exact metric name within the semantic model.
        schema:
          type: string
    get:
      operationId: listMetricTerms
      tags: [glossary]
      summary: List visible glossary terms of a semantic-model metric
      parameters:
        - in: query
          name: details
          description: Return term definitions in place of names.
          schema:
            type: boolean
            default: false
        - in: query
          name: status
          description: Restrict term visibility to this status.
          schema:
            $ref: "#/components/schemas/TermStatusInput"
      responses:
        "200":
          description: Successful glossary binding operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricTermsReadResponse"
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/MetricTermsReadResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: ./openapi.yaml#/components/responses/NotAcceptableErrorResponse
        "409":
          $ref: "#/components/responses/Conflict"
        5XX:
          $ref: "#/components/responses/BindingServerError"
    post:
      operationId: associateMetricTerms
      tags: [glossary]
      summary: Update the glossary terms of a semantic-model metric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TermsAssociateRequest"
      responses:
        "200":
          description: Successful glossary binding operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermNamesResponse"
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/TermNamesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          $ref: ./openapi.yaml#/components/responses/NotAcceptableErrorResponse
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        5XX:
          $ref: "#/components/responses/BindingServerError"
components:
  schemas:
    ObjectTermsReadResponse:
      oneOf:
        - $ref: "#/components/schemas/TermNamesResponse"
        - $ref: "#/components/schemas/ObjectTermsResponse"
    MetricTermsReadResponse:
      oneOf:
        - $ref: "#/components/schemas/TermNamesResponse"
        - $ref: "#/components/schemas/TermListResponse"
    TermNamesResponse:
      allOf:
        - $ref: ./openapi.yaml#/components/schemas/NameListResponse
        - type: object
          required: [code, names]
    TermsAssociateRequest:
      type: object
      description: Supply at least one array. An omitted or null side requests no changes on that side.
      anyOf:
        - required: [termsToAdd]
          properties:
            termsToAdd:
              type: array
              items: {}
        - required: [termsToRemove]
          properties:
            termsToRemove:
              type: array
              items: {}
      properties:
        termsToAdd:
          $ref: "#/components/schemas/OptionalTermNames"
        termsToRemove:
          $ref: "#/components/schemas/OptionalTermNames"
    OptionalTermNames:
      type: array
      nullable: true
      items:
        type: string
        pattern: '\S'
    TermBindingListResponse:
      type: object
      required: [code, bindings]
      properties:
        code:
          type: integer
          enum: [0]
        bindings:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/TermBinding"
        nextPageToken:
          type: string
          minLength: 1
          pattern: '\S'
          description: Present while more candidates remain. Bound to the term, its revision and the filters.
    TermBinding:
      type: object
      required: [kind, object]
      properties:
        object:
          type: object
          required: [fullName, type]
          properties:
            fullName:
              type: string
              description: Fully qualified name of the object or containing semantic model.
            type:
              type: string
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum: [implemented_by]
            object:
              type: object
              properties:
                type:
                  type: string
                  enum: [catalog, schema, table, view, column, fileset, topic, model]
          not:
            required: [metric]
        - type: object
          required: [metric]
          properties:
            kind:
              type: string
              enum: [used_by]
            object:
              type: object
              properties:
                type:
                  type: string
                  enum: [semantic_model]
            metric:
              type: string
              pattern: '\S'
              description: Exact metric name in the containing semantic model.
    ObjectTermsResponse:
      type: object
      required: [code, terms, children]
      properties:
        code:
          type: integer
          enum: [0]
        terms:
          type: array
          items:
            $ref: "#/components/schemas/Term"
        children:
          type: array
          items:
            type: object
            required: [name, terms]
            properties:
              name:
                type: string
                pattern: '\S'
              terms:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/Term"
    TermStatusInput:
      type: string
      description: Case-insensitive term status.
      pattern: "^([Dd][Rr][Aa][Ff][Tt]|[Aa][Pp][Pp][Rr][Oo][Vv][Ee][Dd]|[Dd][Ee][Pp][Rr][Ee][Cc][Aa][Tt][Ee][Dd])$"
      example: APPROVED
    TermStatus:
      description: Responses use the uppercase spelling. Status inputs are case-insensitive.
      type: string
      enum:
        - DRAFT
        - APPROVED
        - DEPRECATED
    TermLink:
      type: object
      required:
        - url
      properties:
        label:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          description: An absolute HTTP or HTTPS URL.
    TermCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        definition:
          type: string
          nullable: true
        synonyms:
          type: array
          items:
            type: string
        status:
          description: Omit to create an APPROVED term.
          allOf:
            - $ref: "#/components/schemas/TermStatusInput"
        domains:
          type: array
          items:
            type: string
        broader:
          type: array
          items:
            type: string
        related:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/TermLink"
        sourceRef:
          type: string
          nullable: true
        properties:
          type: object
          additionalProperties:
            type: string
    Term:
      type: object
      required:
        - name
        - status
        - revisionToken
        - version
        - audit
        - synonyms
        - links
        - properties
        - domains
        - broader
        - narrower
        - related
      properties:
        name:
          type: string
        definition:
          type: string
          nullable: true
        synonyms:
          type: array
          items:
            type: string
        status:
          $ref: "#/components/schemas/TermStatus"
        domains:
          type: array
          items:
            type: string
        broader:
          type: array
          items:
            type: string
        related:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            $ref: "#/components/schemas/TermLink"
        sourceRef:
          type: string
          nullable: true
        properties:
          type: object
          additionalProperties:
            type: string
        narrower:
          type: array
          items:
            type: string
        owner:
          type: object
          nullable: true
          properties:
            name:
              type: string
            type:
              type: string
              enum:
                - user
                - group
          required:
            - name
            - type
        audit:
          $ref: ./openapi.yaml#/components/schemas/Audit
        version:
          type: integer
          format: int64
        revisionToken:
          type: string
          description: Opaque identity and revision to copy into expectedRevision for
            conditional edits.
    TermResponse:
      type: object
      required:
        - code
        - term
      properties:
        code:
          type: integer
          enum:
            - 0
        term:
          $ref: "#/components/schemas/Term"
    TermListResponse:
      type: object
      required:
        - code
        - terms
      properties:
        code:
          type: integer
          enum:
            - 0
        terms:
          type: array
          items:
            $ref: "#/components/schemas/Term"
    TermTreeResponse:
      description: Distinct visible ancestors or descendants, excluding the root.
        Direct relation names in each snapshot identify edges in the hierarchy.
      allOf:
        - $ref: "#/components/schemas/TermListResponse"
    TermUpdatesRequest:
      type: object
      required:
        - updates
      properties:
        expectedRevision:
          type: string
          description: Copy revisionToken from a prior read for a conditional edit. Omit
            this field for an unconditional edit. Null or malformed tokens return 400,
            and a stale token returns 409.
        updates:
          type: array
          items:
            oneOf:
              - type: object
                required:
                  - "@type"
                  - newName
                properties:
                  "@type":
                    type: string
                    enum:
                      - rename
                  newName:
                    type: string
              - type: object
                required:
                  - "@type"
                  - newDefinition
                properties:
                  "@type":
                    type: string
                    enum:
                      - updateDefinition
                  newDefinition:
                    type: string
                    nullable: true
              - type: object
                required:
                  - "@type"
                  - status
                properties:
                  "@type":
                    type: string
                    enum:
                      - setStatus
                  status:
                    $ref: "#/components/schemas/TermStatusInput"
              - type: object
                required:
                  - "@type"
                  - synonym
                properties:
                  "@type":
                    type: string
                    enum:
                      - addSynonym
                  synonym:
                    type: string
              - type: object
                required:
                  - "@type"
                  - synonym
                properties:
                  "@type":
                    type: string
                    enum:
                      - removeSynonym
                  synonym:
                    type: string
              - type: object
                required:
                  - "@type"
                  - domain
                properties:
                  "@type":
                    type: string
                    enum:
                      - addDomain
                  domain:
                    type: string
              - type: object
                required:
                  - "@type"
                  - domain
                properties:
                  "@type":
                    type: string
                    enum:
                      - removeDomain
                  domain:
                    type: string
              - type: object
                required:
                  - "@type"
                  - broader
                properties:
                  "@type":
                    type: string
                    enum:
                      - addBroader
                  broader:
                    type: string
              - type: object
                required:
                  - "@type"
                  - broader
                properties:
                  "@type":
                    type: string
                    enum:
                      - removeBroader
                  broader:
                    type: string
              - type: object
                required:
                  - "@type"
                  - related
                properties:
                  "@type":
                    type: string
                    enum:
                      - addRelated
                  related:
