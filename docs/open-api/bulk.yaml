components:

  schemas:
    BulkMetadataObjectsRequest:
      type: object
      required: [metadataObjects]
      properties:
        metadataObjects:
          type: array
          minItems: 1
          uniqueItems: true
          description: Distinct metadata objects to load, bounded by the server bulk item limit
          items:
            type: object
            required: [type, fullName]
            properties:
              type:
                type: string
                enum: [CATALOG, SCHEMA, TABLE, VIEW, COLUMN, FILESET, TOPIC, MODEL, FUNCTION, SEMANTIC_MODEL]
              fullName:
                type: string
                minLength: 1
                description: Fully qualified object name within the metalake
          example:
            - type: SCHEMA
              fullName: catalog.schema1
            - type: SCHEMA
              fullName: catalog.schema2

    BulkMetadataObjectTagListResponse:
      type: object
      required: [code, results, errors]
      properties:
        code:
          type: integer
          format: int32
          enum: [0]
        results:
          type: array
          items:
            type: object
            required: [metadataObject, tags]
            properties:
              metadataObject:
                $ref: "./tags.yaml#/components/schemas/MetadataObject"
              tags:
                $ref: "./tags.yaml#/components/responses/MetadataObjectTagListResponse"
        errors:
          type: array
          description: Failures identified by their original request index and full object name
          items:
            $ref: "#/components/schemas/BulkError"

    BulkMetadataObjectPolicyListResponse:
      type: object
      required: [code, results, errors]
      properties:
        code:
          type: integer
          format: int32
          enum: [0]
        results:
          type: array
          items:
            type: object
            required: [metadataObject, policies]
            properties:
              metadataObject:
                $ref: "./tags.yaml#/components/schemas/MetadataObject"
              policies:
                $ref: "./policies.yaml#/components/schemas/MetadataObjectPolicyListResponse"
        errors:
          type: array
          description: Failures identified by their original request index and full object name
          items:
            $ref: "#/components/schemas/BulkError"

    BulkUserAddRequest:
      type: object
      required:
        - users
      properties:
        users:
          type: array
          minItems: 1
          description: The maximum length is controlled by `gravitino.server.bulk.maxItems`, which defaults to 100.
          items:
            $ref: "./users.yaml#/components/schemas/UserAddRequest"

    BulkGroupAddRequest:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          minItems: 1
          description: The maximum length is controlled by `gravitino.server.bulk.maxItems`, which defaults to 100.
          items:
            $ref: "./groups.yaml#/components/schemas/GroupAddRequest"

    BulkRoleAddRequest:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          minItems: 1
          description: The maximum length is controlled by `gravitino.server.bulk.maxItems`, which defaults to 100.
          items:
            $ref: "./roles.yaml#/components/schemas/RoleCreateRequest"

    BulkRemoveRequest:
      type: object
      required:
        - names
      properties:
        names:
          type: array
          minItems: 1
          description: The maximum length is controlled by `gravitino.server.bulk.maxItems`, which defaults to 100.
          items:
            type: string

    BulkError:
      type: object
      required:
        - index
        - code
        - type
        - message
      properties:
        index:
          type: integer
          format: int32
          description: The zero-based index of the failed request item
        name:
          type: string
          description: The name of the failed request item
        code:
          type: integer
          format: int32
          description: Gravitino error code of the failed item
        type:
          type: string
          description: Error type of the failed item
        message:
          type: string
          description: Error message of the failed item

    BulkSummary:
      type: object
      required:
        - total
        - succeeded
        - failed
      properties:
        total:
          type: integer
          format: int32
        succeeded:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32

    BulkUserResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        users:
          type: array
          description: Successfully added users
          items:
            $ref: "./users.yaml#/components/schemas/User"
        errors:
          type: array
          description: Item-level errors
          items:
            $ref: "#/components/schemas/BulkError"
        summary:
          $ref: "#/components/schemas/BulkSummary"

    BulkGroupResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        groups:
          type: array
          description: Successfully added groups
          items:
            $ref: "./groups.yaml#/components/schemas/Group"
        errors:
          type: array
          description: Item-level errors
          items:
            $ref: "#/components/schemas/BulkError"
        summary:
          $ref: "#/components/schemas/BulkSummary"

    BulkRoleResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        roles:
          type: array
          description: Successfully added roles
          items:
            $ref: "./roles.yaml#/components/schemas/Role"
        errors:
          type: array
          description: Item-level errors
          items:
            $ref: "#/components/schemas/BulkError"
        summary:
          $ref: "#/components/schemas/BulkSummary"

    BulkRemoveResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        names:
          type: array
          description: Successfully removed names
          items:
            type: string
        errors:
          type: array
          description: Item-level errors
          items:
            $ref: "#/components/schemas/BulkError"
        summary:
          $ref: "#/components/schemas/BulkSummary"

  examples:
    BulkUserAddRequest:
      value: {
        "users": [
          {"name": "alice"},
          {"name": "bob"}
        ]
      }

    BulkRemoveRequest:
      value: {
        "names": ["alice", "bob", "ghost"]
      }

    BulkGroupAddRequest:
      value: {
        "groups": [
          {"name": "engineers"},
          {"name": "analysts"}
        ]
      }

    BulkRoleAddRequest:
      value: {
        "roles": [
          {"name": "developer", "properties": {}, "securableObjects": []},
          {"name": "operator", "properties": {}, "securableObjects": []}
        ]
      }

    BulkRemoveGroupsRequest:
      value: {
        "names": ["engineers", "analysts", "ghost"]
      }

    BulkRemoveRolesRequest:
      value: {
        "names": ["developer", "operator", "ghost"]
      }

    BulkUserResponse:
      value: {
        "code": 0,
        "users": [
          {
            "name": "alice",
            "roles": [],
            "audit": {
              "creator": "gravitino",
              "createTime": "2026-07-28T10:00:00Z"
            }
          }
        ],
        "errors": [
          {
            "index": 1,
            "name": "bob",
            "code": 1004,
            "type": "UserAlreadyExistsException",
            "message": "User already exists: bob"
          }
        ],
        "summary": {"total": 2, "succeeded": 1, "failed": 1}
      }

    BulkRemoveResponse:
      value: {
        "code": 0,
        "names": ["alice", "bob"],
        "errors": [
          {
            "index": 2,
            "name": "ghost",
            "code": 1003,
            "type": "NoSuchUserException",
            "message": "User does not exist: ghost"
          }
        ],
        "summary": {"total": 3, "succeeded": 2, "failed": 1}
      }

    BulkGroupResponse:
      value: {
        "code": 0,
        "groups": [
          {
            "name": "engineers",
            "roles": [],
            "audit": {
              "creator": "gravitino",
              "createTime": "2026-07-28T10:00:00Z"
            }
          }
        ],
        "errors": [
          {
            "index": 1,
            "name": "analysts",
            "code": 1004,
            "type": "GroupAlreadyExistsException",
            "message": "Group already exists: analysts"
          }
        ],
        "summary": {"total": 2, "succeeded": 1, "failed": 1}
      }

    BulkRoleResponse:
      value: {
        "code": 0,
        "roles": [
          {
            "name": "developer",
            "properties": {},
            "securableObjects": []
          }
        ],
        "errors": [
          {
            "index": 1,
            "name": "operator",
            "code": 1004,
            "type": "RoleAlreadyExistsException",
            "message": "Role already exists: operator"
          }
        ],
        "summary": {"total": 2, "succeeded": 1, "failed": 1}
      }

    BulkRemoveGroupsResponse:
      value: {
        "code": 0,
        "names": ["engineers", "analysts"],
        "errors": [
          {
            "index": 2,
            "name": "ghost",
            "code": 1003,
            "type": "NoSuchGroupException",
            "message": "Group does not exist: ghost"
          }
        ],
        "summary": {"total": 3, "succeeded": 2, "failed": 1}
      }

    BulkRemoveRolesResponse:
      value: {
        "code": 0,
        "names": ["developer", "operator"],
        "errors": [
          {
            "index": 2,
            "name": "ghost",
            "code": 1003,
            "type": "NoSuchRoleException",
            "message": "Role does not exist: ghost"
          }
        ],
        "summary": {"total": 3, "succeeded": 2, "failed": 1}
      }
