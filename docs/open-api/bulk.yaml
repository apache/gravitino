---

paths:

  /bulk/metalakes/{metalake}/objects/tags:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/metalake"
    post:
      tags:
        - tag
      summary: List effective tags in bulk
      operationId: listMetadataObjectTags
      description: >-
        Returns effective tags for each requested object, including inherited
        tags. Results follow request order and omit tags the caller
        cannot view. Each result indicates whether tags were omitted. Each requested
        object is checked for access before loading. Results use only stored metadata without
        validating or importing external objects; out-of-band changes are not checked.
        Unregistered objects have no direct assignments but can inherit from registered ancestors.
        Object-level failures, including denied access, are returned in errors with their
        zero-based request index and full object name. Successful objects remain in results,
        in request order. An accepted request returns HTTP 200 even if every object fails.
        The maximum request size is controlled by gravitino.server.bulk.maxItems,
        which defaults to 100. This operation does not modify tag or policy assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkMetadataObjectsRequest"
      responses:
        "200":
          description: Successful tag results and per-object errors, including empty successful results
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/BulkMetadataObjectTagListResponse"
        "400":
          $ref: "./openapi.yaml#/components/responses/BadRequestErrorResponse"
        "403":
          description: The caller cannot access the metalake
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
        "404":
          description: A required request-level resource does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"

  /bulk/metalakes/{metalake}/objects/policies:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/metalake"
    post:
      tags:
        - policy
      summary: List effective policies in bulk
      operationId: listMetadataObjectPolicies
      description: >-
        Returns effective policies for each requested object, including inherited
        policies. Results follow request order and omit policies the caller
