---

paths:

  /metalakes/{metalake}/maintenance/actions/{jobId}/metrics/before:
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/metalake"
      - $ref: "#/components/parameters/jobId"
      - $ref: "#/components/parameters/finish"
    post:
      tags:
        - maintenance
      summary: Report TMS before-maintenance (S0) snapshot metrics
      operationId: reportMaintenanceActionBeforeMetrics
      description: |
        Spark callback for an in-flight maintenance action at S0: persists snapshot metrics and
        records `before_snapshot_id`. `tableId` selects which bound table when one Spark job covers
        multiple tables. Optional query `finish=true` closes that table/policy soft slot (for
        example on snapshot drift / skip). Continue / stop stays in the job.
      requestBody:
        required: true
        content:
          application/vnd.gravitino.v1+json:
            schema:
              $ref: "#/components/schemas/MaintenanceActionMetricsRequest"
            examples:
              MaintenanceActionMetricsRequest:
                $ref: "#/components/examples/MaintenanceActionBeforeMetricsRequest"
      responses:
        "200":
          $ref: "../openapi.yaml#/components/responses/BaseResponse"
        "400":
          $ref: "../openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake or maintenance action does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../openapi.yaml#/components/responses/ServerErrorResponse"

  /metalakes/{metalake}/maintenance/actions/{jobId}/finish:
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/metalake"
      - $ref: "#/components/parameters/jobId"
    post:
      tags:
        - maintenance
      summary: Finish TMS maintenance action soft slot without metrics
      operationId: finishMaintenanceAction
      description: |
        Closes the soft slot for one bound table/policy without writing snapshot metrics.
        Use when the maintenance type does not sample metrics, or when metrics were already
        reported and only occupancy release remains. `tableId` is required for multi-table jobs.
        Optional `afterSnapshotId` sets `after_snapshot_id` when known.
      requestBody:
        required: true
        content:
          application/vnd.gravitino.v1+json:
            schema:
              $ref: "#/components/schemas/MaintenanceActionFinishRequest"
            examples:
              MaintenanceActionFinishRequest:
                $ref: "#/components/examples/MaintenanceActionFinishRequest"
      responses:
        "200":
          $ref: "../openapi.yaml#/components/responses/BaseResponse"
        "400":
          $ref: "../openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake or maintenance action does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../openapi.yaml#/components/responses/ServerErrorResponse"

  /metalakes/{metalake}/maintenance/actions/{jobId}/metrics/after:
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/metalake"
      - $ref: "#/components/parameters/jobId"
      - $ref: "#/components/parameters/finish"
    post:
      tags:
        - maintenance
      summary: Report TMS after-maintenance (S1) snapshot metrics
      operationId: reportMaintenanceActionAfterMetrics
      description: |
        Spark callback for an in-flight maintenance action at S1: persists snapshot metrics.
        `tableId` selects which bound table when one Spark job covers multiple tables. Optional
        query `finish=true` closes that table/policy soft slot and sets `after_snapshot_id` to
        `snapshotId`. Continue / stop stays in the job.
      requestBody:
        required: true
        content:
          application/vnd.gravitino.v1+json:
            schema:
              $ref: "#/components/schemas/MaintenanceActionMetricsRequest"
            examples:
              MaintenanceActionMetricsRequest:
                $ref: "#/components/examples/MaintenanceActionAfterMetricsRequest"
      responses:
        "200":
          $ref: "../openapi.yaml#/components/responses/BaseResponse"
        "400":
          $ref: "../openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake or maintenance action does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../openapi.yaml#/components/responses/ServerErrorResponse"

components:

  parameters:
    jobId:
      name: jobId
      in: path
      description: Gravitino job run id (numeric)
      required: true
      schema:
        type: integer
        format: int64
    finish:
      name: finish
      in: query
      description: |
        When true, close the soft slot for this job/table/policy after storing metrics.
        Before: typically on drift/skip (after_snapshot_id left null). After: typically after
        successful maintenance (after_snapshot_id = snapshotId). Prefer POST .../finish when no
        metrics are written.
      required: false
      schema:
        type: boolean
        default: false

  schemas:
    MaintenanceActionMetricsRequest:
      type: object
      required:
        - tableId
        - snapshotId
        - metricsJson
      properties:
        tableId:
          type: integer
          format: int64
          description: Table entity id bound to this job (required for multi-table jobs)
        snapshotId:
          type: integer
          format: int64
          description: Iceberg snapshot id the metrics were collected for
        metricsJson:
          type: string
          description: Serialized metrics JSON for table_snapshot_metrics
    MaintenanceActionFinishRequest:
      type: object
      required:
        - tableId
      properties:
        tableId:
          type: integer
          format: int64
          description: Table entity id bound to this job
        afterSnapshotId:
          type: integer
          format: int64
          nullable: true
          description: Optional terminal snapshot id stored as after_snapshot_id

  examples:
    MaintenanceActionBeforeMetricsRequest:
      value: {
        "tableId": 10,
        "snapshotId": 9001,
        "metricsJson": "{\"maintenanceType\":\"rewrite_data_files\",\"snapshotId\":9001,\"custom-data-file-mse\":1.5}"
      }
    MaintenanceActionAfterMetricsRequest:
      value: {
        "tableId": 10,
        "snapshotId": 9002,
        "metricsJson": "{\"maintenanceType\":\"rewrite_data_files\",\"snapshotId\":9002,\"custom-data-file-mse\":0.2}"
      }
    MaintenanceActionFinishRequest:
      value: {
        "tableId": 10,
        "afterSnapshotId": null
      }
