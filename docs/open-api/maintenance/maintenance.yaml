---

paths:

  /metalakes/{metalake}/maintenance/actions/{jobId}/metrics:
    parameters:
      - $ref: "../openapi.yaml#/components/parameters/metalake"
      - $ref: "#/components/parameters/jobId"
    post:
      tags:
        - maintenance
      summary: Report TMS maintenance snapshot metrics
      operationId: reportMaintenanceActionMetrics
      description: |
        Spark callback for an in-flight maintenance action: idempotently persists snapshot metrics.
        `tableId` selects which bound table when one Spark job covers multiple tables.
        Does not gate continue/stop (the job decides locally) and does not mark the action finished
        (occupancy is reclaimed when the Gravitino job is terminal).
      requestBody:
        required: true
        content:
          application/vnd.gravitino.v1+json:
            schema:
              $ref: "#/components/schemas/MaintenanceActionMetricsRequest"
            examples:
              MaintenanceActionMetricsRequest:
                $ref: "#/components/examples/MaintenanceActionMetricsRequest"
      responses:
        "200":
          $ref: "../openapi.yaml#/components/responses/BaseResponse"
        "400":
          $ref: "../openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake or maintenance action does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "../openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "../openapi.yaml#/components/responses/ServerErrorResponse"

components:

  parameters:
    jobId:
      name: jobId
      in: path
      description: Gravitino job run id (numeric)
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    MaintenanceActionMetricsRequest:
      type: object
      required:
        - tableId
        - snapshotId
        - metricsJson
      properties:
        tableId:
          type: integer
          format: int64
          description: Table entity id bound to this job (required for multi-table jobs)
        snapshotId:
          type: integer
          format: int64
          description: Iceberg snapshot id the metrics were collected for
        metricsJson:
          type: string
          description: Serialized metrics JSON for table_snapshot_metrics

  examples:
    MaintenanceActionMetricsRequest:
      value: {
        "tableId": 10,
        "snapshotId": 9001,
        "metricsJson": "{\"maintenanceType\":\"rewrite_data_files\",\"snapshotId\":9001,\"custom-data-file-mse\":1.5,\"custom-delete-file-number\":3}"
      }
