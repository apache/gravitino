---

paths:

  /metalakes/{metalake}/objects/{metadataObjectType}/{metadataObjectFullName}/secrets:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/metalake"
      - $ref: "./openapi.yaml#/components/parameters/metadataObjectType"
      - $ref: "./openapi.yaml#/components/parameters/metadataObjectFullName"
    get:
      tags:
        - secrets
      summary: Get secrets
      operationId: getSecrets
      description: |
        Returns secret-manager plaintext properties for the metadata object.
        Every secret-URN value is resolved and returned, including keys that may
        also appear in the credentials API (for example jdbc-password).
        Supported types: catalog, schema, fileset.
      responses:
        "200":
          description: Returns the secrets map for the specified metadata object.
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/responses/SecretsResponse"
              examples:
                SecretsResponse:
                  $ref: "#/components/examples/SecretsResponse"
        "400":
          $ref: "./openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake or object does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "./metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"


components:
  schemas:
    SecretBinding:
      type: object
      description: >
        Write-through secret binding. Provider is a registered secrets-provider
        instance name; plaintext is the secret to store. The persisted property
        value becomes a URN.
      required:
        - provider
        - plaintext
      properties:
        provider:
          type: string
          description: Registered secrets-provider instance name
        plaintext:
          type: string
          description: Plaintext secret to write through
          format: password

    SecretReference:
      type: object
      description: >
        External secret locator. Provider is a registered secrets-provider
        instance name; attributes are provider-specific. The server builds and
        persists the URN. Clients must not send a raw gravitino secret URN.
      required:
        - provider
        - attributes
      properties:
        provider:
          type: string
          description: Registered secrets-provider instance name
        attributes:
          type: object
          description: Provider-specific locator keys (must be non-empty)
          additionalProperties:
            type: string
          minProperties: 1

  responses:
    SecretsResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        secrets:
          type: object
          description: Map of secret property key to plaintext value
          additionalProperties:
            type: string

  examples:
    SecretsResponse:
      value: {
        "code": 0,
        "secrets": {
          "authentication.kerberos.keytab": "plaintext-keytab-content"
        }
      }
