---
components:
  schemas:
    SecretBinding:
      type: object
      description: >
        Write-through secret binding. Provider is a registered secrets-provider
        instance name; value is plaintext to store. The persisted property value
        becomes a URN.
      required:
        - provider
        - value
      properties:
        provider:
          type: string
          description: Registered secrets-provider instance name
        value:
          type: string
          description: Plaintext secret value to write through
          format: password

    SecretReference:
      type: object
      description: >
        External secret locator. Provider is a registered secrets-provider
        instance name; attributes are provider-specific. The server builds and
        persists the URN. Clients must not send a raw gravitino secret URN.
      required:
        - provider
      properties:
        provider:
          type: string
          description: Registered secrets-provider instance name
        attributes:
          type: object
          description: Provider-specific locator keys
          nullable: true
          additionalProperties:
            type: string
