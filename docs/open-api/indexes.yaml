---

components:
  schemas:
    IndexesSpec:
      type: array
      items:
        $ref: "#/components/schemas/IndexSpec"

    IndexSpec:
      type: object
      required:
        - indexType
        - fieldNames
      properties:
        indexType:
          type: string
          description: >-
            Responses use the uppercase names below. Requests accept index types case-insensitively.
            Support depends on the catalog. For example, MySQL supports PRIMARY_KEY and UNIQUE_KEY,
            and the DATA_SKIPPING_* types describe ClickHouse indexes.
          enum:
            - "PRIMARY_KEY"
            - "UNIQUE_KEY"
            - "SCALAR"
            - "BTREE"
            - "BITMAP"
            - "LABEL_LIST"
            - "INVERTED"
            - "VECTOR"
            - "IVF_FLAT"
            - "IVF_SQ"
            - "IVF_PQ"
            - "IVF_HNSW_SQ"
            - "IVF_HNSW_PQ"
            - "DATA_SKIPPING_MINMAX"
            - "DATA_SKIPPING_BLOOM_FILTER"
            - "DATA_SKIPPING_SET"
            - "DATA_SKIPPING_NGRAMBFV1"
            - "DATA_SKIPPING_TOKENBFV1"
            - "DATA_SKIPPING_TEXT"
            - "DATA_SKIPPING_VECTOR_SIMILARITY"
            - "DATA_SKIPPING_ANNOY"
            - "DATA_SKIPPING_USEARCH"
        name:
          type: string
          description: The name of the index
          nullable: true
        fieldNames:
          type: array
          minItems: 1
          items:
            $ref: "./tables.yaml#/components/schemas/FieldName"
        properties:
          type: object
          additionalProperties:
            type: string
          description: Extra index properties (e.g., granularity for ClickHouse data-skipping indexes)
