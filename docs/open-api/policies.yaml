---

paths:

  /metalakes/{metalake}/policies:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/metalake"
    get:
      tags:
        - policy
      summary: List policies (names)
      operationId: listPolicies
      parameters:
        - $ref: "#/components/parameters/details"
      responses:
        "200":
          description: Returns the list of policy objects if {details} is true, otherwise returns the list of policy names
          content:
            application/vnd.gravitino.v1+json:
              schema:
                oneOf:
                  - $ref: "./openapi.yaml#/components/schemas/NameListResponse"
                  - $ref: "#/components/schemas/PolicyListResponse"
              examples:
                NameListResponse:
                  $ref: "#/components/examples/NameListResponse"
                PolicyListResponse:
                  $ref: "#/components/examples/PolicyListResponse"
        "400":
          $ref: "./openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "./metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"

    post:
      tags:
        - policy
      summary: Create policy
      operationId: createPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCreateRequest"
            examples:
              PolicyCreate:
                $ref: "#/components/examples/PolicyCreate"

      responses:
        "200":
          description: Returns the created policy object
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
              examples:
                PolicyResponse:
                  $ref: "#/components/examples/PolicyResponse"
        "409":
          description: Conflict - The target policy already exists in the specified metalake
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                PolicyAlreadyExistsException:
                  $ref: "#/components/examples/PolicyAlreadyExistsException"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"

  /metalakes/{metalake}/policies/{policy}:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/metalake"
      - $ref: "./openapi.yaml#/components/parameters/policy"

    get:
      tags:
        - policy
      summary: Get policy
      operationId: getPolicy
      description: Returns the specified policy information in the specified metalake
      responses:
        "200":
          description: Returns the policy object
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
              examples:
                PolicyResponse:
                  $ref: "#/components/examples/PolicyResponse"
        "404":
          description: Not Found - The specified policy does not exist in the specified metalake
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "./metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchPolicyException:
                  $ref: "#/components/examples/NoSuchPolicyException"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"

    put:
      tags:
        - policy
      summary: Update policy
      operationId: alterPolicy
      description: Alters the specified policy information in the specified metalake
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpdatesRequest"
      responses:
        "200":
            description: Returns the updated policy object
            content:
              application/vnd.gravitino.v1+json:
                schema:
                  $ref: "#/components/schemas/PolicyResponse"
                examples:
                  PolicyResponse:
                    $ref: "#/components/examples/PolicyResponse"
        "404":
          description: Not Found - The specified policy does not exist in the specified metalake
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "./metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchPolicyException:
                  $ref: "#/components/examples/NoSuchPolicyException"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"

    patch:
      tags:
        - policy
      summary: Enable or disable a policy
      operationId: setPolicy
      description: Enable or disable a policy in the specified metalake
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicySetRequest"
      responses:
        "200":
          $ref: "./openapi.yaml#/components/responses/BaseResponse"
        "404":
          description: Not Found - The specified policy does not exist in the specified metalake
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "./metalakes.yaml#/components/examples/NoSuchMetalakeException"
                NoSuchPolicyException:
                  $ref: "#/components/examples/NoSuchPolicyException"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"

    delete:
      tags:
        - policy
      summary: Delete policy
      operationId: deletePolicy
      responses:
        "200":
          $ref: "./openapi.yaml#/components/responses/DropResponse"
        "400":
          $ref: "./openapi.yaml#/components/responses/BadRequestErrorResponse"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"


  /metalakes/{metalake}/objects/{metadataObjectType}/{metadataObjectFullName}/policies:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/metalake"
      - $ref: "./openapi.yaml#/components/parameters/metadataObjectType"
      - $ref: "./openapi.yaml#/components/parameters/metadataObjectFullName"
    get:
      tags:
        - policy
      summary: List policies (names) for metadata object
      operationId: listPoliciesForMetadataObject
      parameters:
        - $ref: "#/components/parameters/details"
      responses:
        "200":
          description: Returns policies derived from the effective tags of the specified metadata object; details=true returns policy objects, otherwise policy names
          content:
            application/vnd.gravitino.v1+json:
              schema:
                oneOf:
                  - $ref: "./openapi.yaml#/components/schemas/NameListResponse"
                  - $ref: "#/components/schemas/PolicyListResponse"
              examples:
                NameListResponse:
                  $ref: "#/components/examples/NameListResponse"
                PolicyListResponse:
                  $ref: "#/components/examples/PolicyListResponse"
        "400":
          $ref: "./openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
              examples:
                NoSuchMetalakeException:
                  $ref: "./metalakes.yaml#/components/examples/NoSuchMetalakeException"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"




  /metalakes/{metalake}/policies/{policy}/tags:
    parameters:
      - $ref: "./openapi.yaml#/components/parameters/metalake"
      - $ref: "./openapi.yaml#/components/parameters/policy"
    get:
      tags:
        - policy
      summary: List tags associated with a policy
      operationId: listTagsForPolicy
      parameters:
        - $ref: "#/components/parameters/details"
      responses:
        "200":
          description: Returns tag names or detailed policy-tag associations
          content:
            application/vnd.gravitino.v1+json:
              schema:
                oneOf:
                  - $ref: "./openapi.yaml#/components/schemas/NameListResponse"
                  - $ref: "#/components/schemas/TagForPolicyAssociationListResponse"
        "400":
          $ref: "./openapi.yaml#/components/responses/BadRequestErrorResponse"
        "404":
          description: Not Found - The specified metalake or policy does not exist
          content:
            application/vnd.gravitino.v1+json:
              schema:
                $ref: "./openapi.yaml#/components/schemas/ErrorModel"
        "5xx":
          $ref: "./openapi.yaml#/components/responses/ServerErrorResponse"


components:
  parameters:
    details:
      name: details
      in: query
      description: Include detailed information about the policy
      required: false
      schema:
        type: boolean
        default: false

  schemas:

    PolicyAssociationSelector:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: The selector type used to match tag assignments
          enum: ["ALL_VALUES", "TAG_VALUE"]
        value:
          type: string
          description: The assignment value required by a TAG_VALUE selector
          nullable: true
          maxLength: 256

    TagForPolicyAssociation:
      type: object
      required:
        - tag
        - selector
      properties:
        tag:
          $ref: "./tags.yaml#/components/schemas/Tag"
        selector:
          $ref: "#/components/schemas/PolicyAssociationSelector"

    TagForPolicyAssociationListResponse:
      type: object
      required:
        - code
        - associations
      properties:
        code:
          type: integer
          format: int32
          enum: [0]
        associations:
          type: array
          items:
            $ref: "#/components/schemas/TagForPolicyAssociation"

    IcebergCompactionContent:
      type: object
      description: Built-in Iceberg compaction thresholds, scoring weights, and job options.
      properties:
        minDataFileMse:
          type: integer
          format: int64
          minimum: 0
          default: 405323966463344
        minDeleteFileNumber:
          type: integer
          format: int64
          minimum: 0
          default: 1
        dataFileMseWeight:
          type: integer
          format: int64
          minimum: 0
          default: 1
        deleteFileNumberWeight:
          type: integer
          format: int64
          minimum: 0
          default: 100
        maxPartitionNum:
          type: integer
          format: int64
          minimum: 1
          default: 50
        rewriteOptions:
          type: object
          default: {}
          description: Rewrite options with nonempty values and keys matching [A-Za-z0-9._-]+, without the job.options. prefix.
          additionalProperties:
            type: string
            minLength: 1

    IcebergCompactionPolicy:
      allOf:
        - $ref: '#/components/schemas/PolicyBase'
        - type: object
          required: [content]
          properties:
            policyType:
              type: string
              enum: [system_iceberg_compaction]
            content:
              $ref: '#/components/schemas/IcebergCompactionContent'

    IcebergCompactionPolicyCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PolicyCreateRequestBase'
        - type: object
          required: [content]
          properties:
            policyType:
              type: string
              enum: [system_iceberg_compaction]
            content:
              $ref: '#/components/schemas/IcebergCompactionContent'

    IcebergOrphanFileRemovalContent:
      type: object
      description: Table-level orphan cleanup options. Scheduling is configured separately.
      properties:
        olderThanDays:
          type: integer
          format: int64
          minimum: 1
          maximum: 36500
          default: 3
          description: Minimum age of orphan files in days, including for dry runs.
        location:
          type: string
          nullable: true
          description: Optional scan location within the target table's storage root.
        dryRun:
          type: boolean
          default: false
          description: List candidates without deleting them.

    IcebergOrphanFileRemovalPolicy:
      allOf:
        - $ref: '#/components/schemas/PolicyBase'
        - type: object
          required: [content]
          properties:
            policyType:
              type: string
              enum: [system_iceberg_orphan_file_removal]
            content:
              $ref: '#/components/schemas/IcebergOrphanFileRemovalContent'

    IcebergOrphanFileRemovalPolicyCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PolicyCreateRequestBase'
        - type: object
          required: [content]
          properties:
            policyType:
              type: string
              enum: [system_iceberg_orphan_file_removal]
            content:
              $ref: '#/components/schemas/IcebergOrphanFileRemovalContent'

    RowFilterContent:
      type: object
      description: Expression content for a built-in row-filter policy.
      required:
        - expression
      properties:
        expression:
          type: string
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
          description: A nonblank expression whose UTF-8 encoding must not exceed 16 KiB.

    ColumnMaskContent:
      type: object
      description: Expression content for a built-in column-mask policy.
      required:
        - expression
      properties:
        expression:
          type: string
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
          description: A nonblank expression whose UTF-8 encoding must not exceed 16 KiB.

    RowFilterPolicy:
      allOf:
        - $ref: '#/components/schemas/PolicyBase'
        - type: object
          required: [content]
          properties:
            policyType:
              type: string
              enum: [system_row_filter]
            content:
              $ref: '#/components/schemas/RowFilterContent'

    RowFilterPolicyCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PolicyCreateRequestBase'
        - type: object
          required: [content]
          properties:
            policyType:
              type: string
              enum: [system_row_filter]
            content:
              $ref: '#/components/schemas/RowFilterContent'

    ColumnMaskPolicy:
      allOf:
        - $ref: '#/components/schemas/PolicyBase'
        - type: object
          required: [content]
          properties:
            policyType:
              type: string
              enum: [system_column_mask]
            content:
              $ref: '#/components/schemas/ColumnMaskContent'

    ColumnMaskPolicyCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PolicyCreateRequestBase'
        - type: object
          required: [content]
          properties:
            policyType:
              type: string
              enum: [system_column_mask]
            content:
              $ref: '#/components/schemas/ColumnMaskContent'

    PolicyContentBase:
      type: object
      description: A base content structure for policies
      required:
        - supportedObjectTypes
      properties:
        supportedObjectTypes:
          type: array
          description: The types of metadata objects this policy content can be applied to.
          minItems: 1
          items:
            type: string
            enum: [ "CATALOG", "SCHEMA", "TABLE", "FILESET", "TOPIC", "MODEL", "VIEW", "FUNCTION" ]
        properties:
          type: object
          description: A map of string-to-string properties for the policy content.
          additionalProperties:
            type: string
          example:
            "key1": "value1"
            "key2": "value2"

    CustomPolicyContent:
      type: object
      description: Content for a custom policy type.
      allOf:
        - $ref: '#/components/schemas/PolicyContentBase'
        - type: object
          properties:
            customRules:
              type: object
              description: A map of custom rules where the key is the rule name and the value can be of any type.
              additionalProperties: { }
              example:
                rule1: "rule1"
                rule2: 123

    PolicyBase:
      type: object
      description: A basic policy without content
      required:
        - name
        - policyType
        - enabled
        - audit
      properties:
        name:
          type: string
          description: The name of the policy
        comment:
          type: string
          description: A comment about the policy
          nullable: true
        policyType:
          type: string
          description: The type of the policy
        enabled:
          type: boolean
          description: Whether the policy is enabled
        audit:
          $ref: "./openapi.yaml#/components/schemas/Audit"
        inherited:
          type: boolean
          description: Whether the policy is selected only from ancestor metadata objects, either
            through inherited tags or legacy direct policy associations
          nullable: true

    CustomPolicy:
      description: A policy with custom content
      allOf:
        - $ref: '#/components/schemas/PolicyBase'
        - type: object
          required:
            - content
          properties:
            policyType:
              type: string
              not:
                enum: [system_iceberg_compaction, system_iceberg_orphan_file_removal, system_row_filter, system_column_mask]
            content:
              $ref: '#/components/schemas/CustomPolicyContent'

    Policy:
      type: object
      description: A basic policy without content
      oneOf:
        - $ref: '#/components/schemas/CustomPolicy'
        - $ref: '#/components/schemas/IcebergOrphanFileRemovalPolicy'
        - $ref: '#/components/schemas/IcebergCompactionPolicy'
        - $ref: '#/components/schemas/RowFilterPolicy'
        - $ref: '#/components/schemas/ColumnMaskPolicy'
      discriminator:
        propertyName: policyType
        mapping:
          custom: '#/components/schemas/CustomPolicy'
          system_iceberg_orphan_file_removal: '#/components/schemas/IcebergOrphanFileRemovalPolicy'
          system_iceberg_compaction: '#/components/schemas/IcebergCompactionPolicy'
          system_row_filter: '#/components/schemas/RowFilterPolicy'
          system_column_mask: '#/components/schemas/ColumnMaskPolicy'

    PolicyListResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        policies:
          type: array
          description: A list of policy objects
          items:
            $ref: "#/components/schemas/Policy"

    MetadataObject:
      type: object
      description: A metadata object
      properties:
        fullName:
          type: string
          description: The name of the metadata object, separated by dots
        type:
          type: string
          description: The type of the metadata object
          enum:
            - "CATALOG"
            - "SCHEMA"
            - "TABLE"
            - "FILESET"
            - "TOPIC"
            - "MODEL"
            - "VIEW"
            - "FUNCTION"
            - "COLUMN"

    PolicyCreateRequestBase:
      type: object
      description: A base policy create request without content
      required:
        - name
        - policyType
      properties:
        name:
          type: string
          description: The name of the policy
        comment:
          type: string
          description: A comment for the policy
          nullable: true
        policyType:
          type: string
          description: The type of the policy
        enabled:
          type: boolean
          description: Whether the policy is enabled
          default: true

    CustomPolicyCreateRequest:
      description: A request to create a policy with a custom content structure.
      allOf:
        - $ref: '#/components/schemas/PolicyCreateRequestBase'
        - type: object
          required:
            - content
          properties:
            policyType:
              type: string
              not:
                enum: [system_iceberg_compaction, system_iceberg_orphan_file_removal, system_row_filter, system_column_mask]
            content:
              $ref: '#/components/schemas/CustomPolicyContent'

    PolicyCreateRequest:
      description: A request to create a policy.
      type: object
      oneOf:
        - $ref: '#/components/schemas/CustomPolicyCreateRequest'
        - $ref: '#/components/schemas/IcebergOrphanFileRemovalPolicyCreateRequest'
        - $ref: '#/components/schemas/IcebergCompactionPolicyCreateRequest'
        - $ref: '#/components/schemas/RowFilterPolicyCreateRequest'
        - $ref: '#/components/schemas/ColumnMaskPolicyCreateRequest'
      discriminator:
        propertyName: policyType
        mapping:
          custom: '#/components/schemas/CustomPolicyCreateRequest'
          system_iceberg_orphan_file_removal: '#/components/schemas/IcebergOrphanFileRemovalPolicyCreateRequest'
          system_iceberg_compaction: '#/components/schemas/IcebergCompactionPolicyCreateRequest'
          system_row_filter: '#/components/schemas/RowFilterPolicyCreateRequest'
          system_column_mask: '#/components/schemas/ColumnMaskPolicyCreateRequest'


    PolicyUpdatesRequest:
      type: object
      required:
        - updates
      properties:
        updates:
          type: array
          items:
            $ref: "#/components/schemas/PolicyUpdateRequest"

    PolicyUpdateRequest:
      oneOf:
        - $ref: "#/components/schemas/RenamePolicyRequest"
        - $ref: "#/components/schemas/UpdatePolicyCommentRequest"
        - $ref: "#/components/schemas/UpdatePolicyContentRequest"
      discriminator:
        propertyName: "@type"
        mapping:
          rename: "#/components/schemas/RenamePolicyRequest"
          updateComment: "#/components/schemas/UpdatePolicyCommentRequest"
          updateContent: "#/components/schemas/UpdatePolicyContentRequest"

    RenamePolicyRequest:
      type: object
      required:
        - "@type"
        - newName
      properties:
        "@type":
          type: string
          enum:
            - rename
        newName:
          type: string
          description: The new name of the policy
      example: {
        "@type": "rename",
        "newName": "my_policy_new"
      }

    PolicySetRequest:
      type: object
      properties:
        enable:
          type: boolean
          description: Whether to enable or disable the policy

    UpdatePolicyCommentRequest:
      type: object
      required:
        - "@type"
        - newComment
      properties:
        "@type":
          type: string
          enum:
            - updateComment
        newComment:
          type: string
          description: The new comment of the policy
      example: {
        "@type": "updateComment",
        "newComment": "This is my new policy comment"
      }

    UpdatePolicyContentRequestBase:
      type: object
      required:
        - "@type"
        - policyType
        - newContent
      properties:
        "@type":
          type: string
          enum: [updateContent]
        policyType:
          type: string
          description: The type of the policy.

    UpdateCustomPolicyContentRequest:
      allOf:
        - $ref: '#/components/schemas/UpdatePolicyContentRequestBase'
        - type: object
          properties:
            policyType:
              type: string
              not:
                enum: [system_iceberg_compaction, system_iceberg_orphan_file_removal, system_row_filter, system_column_mask]
            newContent:
              $ref: '#/components/schemas/CustomPolicyContent'

    UpdateIcebergCompactionPolicyContentRequest:
      allOf:
        - $ref: '#/components/schemas/UpdatePolicyContentRequestBase'
        - type: object
          properties:
            policyType:
              type: string
              enum: [system_iceberg_compaction]
            newContent:
              $ref: '#/components/schemas/IcebergCompactionContent'

    UpdateIcebergOrphanFileRemovalPolicyContentRequest:
      allOf:
        - $ref: '#/components/schemas/UpdatePolicyContentRequestBase'
        - type: object
          properties:
            policyType:
              type: string
              enum: [system_iceberg_orphan_file_removal]
            newContent:
              $ref: '#/components/schemas/IcebergOrphanFileRemovalContent'

    UpdateRowFilterPolicyContentRequest:
      allOf:
        - $ref: '#/components/schemas/UpdatePolicyContentRequestBase'
        - type: object
          properties:
            policyType:
              type: string
              enum: [system_row_filter]
            newContent:
              $ref: '#/components/schemas/RowFilterContent'

    UpdateColumnMaskPolicyContentRequest:
      allOf:
        - $ref: '#/components/schemas/UpdatePolicyContentRequestBase'
        - type: object
          properties:
            policyType:
              type: string
              enum: [system_column_mask]
            newContent:
              $ref: '#/components/schemas/ColumnMaskContent'

    UpdatePolicyContentRequest:
      description: Selects typed content using the sibling policyType field, matching REST deserialization.
      oneOf:
        - $ref: '#/components/schemas/UpdateCustomPolicyContentRequest'
        - $ref: '#/components/schemas/UpdateIcebergCompactionPolicyContentRequest'
        - $ref: '#/components/schemas/UpdateIcebergOrphanFileRemovalPolicyContentRequest'
        - $ref: '#/components/schemas/UpdateRowFilterPolicyContentRequest'
        - $ref: '#/components/schemas/UpdateColumnMaskPolicyContentRequest'
      discriminator:
        propertyName: policyType
        mapping:
          custom: '#/components/schemas/UpdateCustomPolicyContentRequest'
          system_iceberg_compaction: '#/components/schemas/UpdateIcebergCompactionPolicyContentRequest'
          system_iceberg_orphan_file_removal: '#/components/schemas/UpdateIcebergOrphanFileRemovalPolicyContentRequest'
          system_row_filter: '#/components/schemas/UpdateRowFilterPolicyContentRequest'
          system_column_mask: '#/components/schemas/UpdateColumnMaskPolicyContentRequest'
      example: {
        "@type": "updateContent",
        "policyType": "custom",
        "newContent": {
          "policyType": "custom",
          "customRules": {
            "rule1": 456
          },
          "supportedObjectTypes": [
              "CATALOG",
              "SCHEMA",
              "TABLE",
              "FILESET",
              "TOPIC",
              "MODEL"
          ],
          "properties": {
            "key1": "new_value1",
            "key2": "new_value2"
          }
        }
      }


    PolicyResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: Status code of the response
          enum:
            - 0
        policy:
          $ref: "#/components/schemas/Policy"

  examples:
    NameListResponse:
      value: {
        "code": 0,
        "names": ["my_policy1", "my_policy2"]
      }

    PolicyListResponse:
      value: {
        "code": 0,
        "policies": [
          {
            "name": "my_policy1",
            "comment": "This is a test policy",
            "policyType": "custom",
            "enabled": false,
            "content": {
              "customRules": {
                "rule1": 123
